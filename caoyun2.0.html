  }
  /* 单 BGM 互斥：切章 crossfade */
  function loopBGM(id,fadeIn){
    desired=id||null;
    if(isMuted()){ current=null; return false; }
    if(id&&nodesMap[id]&&current===id) return true;      /* 同曲不重播（互斥） */
    var prev=current;
    current=id||null;
    if(prev&&prev!==id&&nodesMap[prev]) stopNode(nodesMap[prev],0.6);
    if(id) return startBGM(id,(fadeIn==null?0.8:fadeIn));
    return true;
  }
  function stopBGM(silent){
    if(current&&nodesMap[current]) stopNode(nodesMap[current],silent?0.1:0.6);
    nodesMap={}; current=null; if(silent) desired=desired; else desired=desired;
  }
  function crossfade(from,to){
    if(from&&nodesMap[from]) stopNode(nodesMap[from],0.6);
    current=to||null; desired=to||null;
    if(to) startBGM(to,0.8);
  }
  /* 状态导出（供无头环境断言，不依赖声音输出） */
  function state(){
    return { muted:isMuted(), current:current, desired:desired,
             playing:Object.keys(nodesMap), hasCtx:!!ctx,
             patterns:Object.keys(patterns), hasBgms:['bgm_oath','bgm_ch1','bgm_ch2','bgm_ch3','bgm_ch4','bgm_clear','haozi_ram'].every(function(k){ return !!patterns[k]; }) };
  }
  function exportPatterns(){
    var o={}; Object.keys(patterns).forEach(function(k){ o[k]={ bpm:patterns[k].bpm, barDur:patterns[k].barDur, vol:patterns[k].vol }; });
    return o;
  }

  return { init:init, resume:resume, play:play, loopBGM:loopBGM, stopBGM:stopBGM, crossfade:crossfade,
           setMuted:setMuted, isMuted:isMuted, state:state, exportPatterns:exportPatterns, patterns:patterns,
           sfxNames:function(){ return Data.sfxTable.map(function(s){ return s.name; }); } };
})();

/* ============================================================
 * M8 · Agent（12 意图 + KB 检索 + 指代消解 + 模板生成 + 边界话术 + 记忆）
 * 硬约束：应答只能由命中 KB 条目字段拼装；未命中一律走三段边界话术。
 * ============================================================ */
var Agent=(function(){
  function norm(t){ return String(t==null?'':t).replace(/\s+/g,'').trim(); }

  function callName(ctx){
    if(ctx&&ctx.nickname) return ctx.nickname+'，';
    return '小指挥官，';
  }
  function personaOf(ctx){
    var b=Data.beasts[ctx&&ctx.beast]||Data.beasts.qinglong;
    return b;
  }

  /* ---- 指代消解：它 / 这个 / 那个 / 这件 → lastArtifactId ---- */
  var PRON=['它','这个','那个','这件','那件','此物','这件宝贝'];
  function hasPronoun(t){ return PRON.some(function(p){ return t.indexOf(p)>=0; }); }

  /* ---- KB 命中（纯字符串匹配；别名＋主题关键词，无模型） ---- */
  function findByText(text){
    var t=norm(text), cands=[];
    Data.artifacts.forEach(function(a){
      if(t.indexOf(a.name)>=0){ cands.push({kind:'artifact',id:a.id,score:20}); return; }
      var al=a.aliases||[];
      for(var i=0;i<al.length;i++){ if(al[i].length>=2&&t.indexOf(al[i])>=0){ cands.push({kind:'artifact',id:a.id,score:10}); break; } }
    });
    Data.topics.forEach(function(tp){
      var best=0;
      (tp.keywords||[]).forEach(function(k){ if(k.length>=2&&t.indexOf(k)>=0&&k.length>best) best=k.length; });
      if(best) cands.push({kind:'topic',id:tp.id,score:2+best});
    });
    Data.chapters.forEach(function(c){
      if(t.indexOf(c.name)>=0) cands.push({kind:'chapter',id:c.id,score:8});
      else if(t.indexOf(c.crisis)>=0) cands.push({kind:'chapter',id:c.id,score:8});
    });
    cands.sort(function(a,b){ return b.score-a.score; });
    return cands[0]||null;
  }

  /* ---- 意图分类（关键词加权；12 类） ---- */
  function classify(text,ctx){
    var t=norm(text);
    var scores={};
    Data.intents.forEach(function(intent){
      var s=0;
      (intent.keywords||[]).forEach(function(k){ if(t.indexOf(k)>=0) s+=k.length; });
      scores[intent.id]=s;
    });
    /* 超纲 / 敏感 为强信号（域外关键词命中即压制） */
    if(scores['INT-超纲']>0){ return { intentId:'INT-超纲', key:'boundary', score:scores['INT-超纲'] }; }
    if(scores['INT-敏感']>0){ return { intentId:'INT-敏感', key:'sensitive', score:scores['INT-敏感'] }; }
    /* 取最高分；全 0 → 无意义（随后若无 KB 命中则 → 边界） */
    var best=null, bestScore=0;
    Data.intents.forEach(function(intent){
      if(scores[intent.id]>bestScore){ bestScore=scores[intent.id]; best=intent; }
    });
    if(!best||bestScore===0){
      var f=findByText(t);
      if(f&&f.kind!=='artifact') return { intentId:'INT-知识延伸', key:'extend', score:f.score };
      if(f&&f.kind==='artifact') return { intentId:'INT-文物', key:'artifact', score:f.score };
      return { intentId:'INT-无意义', key:'nonsense', score:0 };
    }
    return { intentId:best.id, key:best.key, score:bestScore };
  }

  /* ---- 检索 ---- */
  function retrieveArtifact(text,ctx){
    var t=norm(text), f=findByText(t);
    if(f&&f.kind==='artifact') return Data.artifactById[f.id];
    if(hasPronoun(t)&&ctx&&ctx.lastArtifactId&&Data.artifactById[ctx.lastArtifactId]) return Data.artifactById[ctx.lastArtifactId];
    if(f&&f.kind==='chapter'){ var list=Data.artifactsOfChapter(f.id); if(list&&list.length) return list[0]; }
    if(ctx&&ctx.chapterId){ var l2=Data.artifactsOfChapter(ctx.chapterId); if(l2&&l2.length) return l2[0]; }
    return null;
  }
  function retrieveTopic(text){
    var t=norm(text), f=findByText(t);
    if(f&&f.kind==='topic') return Data.topicById[f.id];
    return null;
  }

  /* ---- 生成（模板 + 槽位；槽位只能取自 KB） ---- */
  /* A5: 缺字段不得输出 undefined */
  function safeStr(v){ return (v==null||v==='')?'—':String(v); }
  function genArtifact(a,ctx){
    if(!a) return boundary();
    var b=personaOf(ctx);
    var fact=(a.facts&&a.facts[0])||'';
    return { kind:'kb', intent:'INT-文物',
      text:callName(ctx)+'关于「'+safeStr(a.name)+'」：它是'+safeStr(a.era)+'的'+safeStr(a.cat)+'，大小 '+safeStr(a.size)+'。'+fact,
      followUp:'你猜它为什么长成这样？',
      sources:[safeStr(a.source)] };
  }
  function genArtifactList(ctx){
    var ch=ctx&&ctx.chapterId?Data.chapterById[ctx.chapterId]:null;
    var list=ch?Data.artifactsOfChapter(ch.id):Data.artifacts;
    if(!list||!list.length) return boundary();
    var names=list.slice(0,5).map(function(a){ return a.name; }).join('、');
    return { kind:'kb', intent:'INT-文物',
      text:callName(ctx)+'这里的文物我都能讲：'+names+(list.length>5?' 等':'')+'。你指着哪一件，或者说出它的名字（比如「江豚壶」「官斛」「铁锭」），我就详细讲给你听。',
      followUp:'你想先认识哪一件？', sources:[list[0].source] };
  }
  function genTopic(tp,ctx){
    if(!tp||!tp.facts||!tp.facts.length) return boundary();
    var fact=tp.facts[Util.randInt(0,tp.facts.length-1)];
    return { kind:'kb', intent:'INT-知识延伸',
      text:callName(ctx)+tp.title+'是这样的：'+fact.text,
      followUp:tp.followUp||'你还想知道什么？',
      sources:[fact.source] };
  }
  function genVenue(ctx){
    var tp=Data.topicById['topic-city'];
    if(!tp||!tp.facts.length) return boundary();
    return { kind:'kb', intent:'INT-城市场馆',
      text:callName(ctx)+tp.facts[0].text,
      followUp:tp.followUp, sources:[tp.facts[0].source] };
  }
  function genPet(ctx){
    var b=personaOf(ctx);
    var stage=Util.clamp(Util.safeNum(ctx.stage,0),0,4);
    return { kind:'kb', intent:'INT-养宠',
      text:callName(ctx)+'我是'+b.name+'，'+b.traits.join('、')+'。你陪着我破解运河的危机，我就能从「'+Data.stageNames[0]+'」一点点长到「'+Data.stageNames[4]+'」——现在我在第 '+stage+' 阶「'+Data.stageNames[stage]+'」。',
      followUp:'你希望我长成什么样子？', sources:['灵宠设定'] };
  }
  function genGreet(ctx){
    var b=personaOf(ctx);
    return { kind:'kb', intent:'INT-问候',
      text:callName(ctx)+'我是'+b.name+'，你的守护搭档，'+b.persona+'。'+b.motto,
      followUp:'今天想先去哪一章看看？', sources:['灵宠设定'] };
  }
  function genEmotion(ctx){
    return { kind:'kb', intent:'INT-情绪陪伴',
      text:callName(ctx)+'累了就歇一会儿，我陪着你。这一步有点难，对不对？我们可以只挑一件文物，慢慢看，不急。',
      followUp:'要不要我先给你一个方向级的小提示？', sources:[] };
  }
  function genPraise(ctx){
    try{ ctx.praiseCount=0; }catch(e){}
    var n=Util.safeNum(ctx.artifactsDone,0);
    var dOpened=Util.safeNum(ctx.detailsOpened,0);
    return { kind:'kb', intent:'INT-索取夸奖',
      text:callName(ctx)+'当然厉害！你已经看过 '+n+' 件文物，还点开了 '+dOpened+' 个细节——你这是把「观察力」用上啦。',
      followUp:'要不要再去发现一件新宝贝？', sources:[] };
  }
  function genStory(ctx){
    var c=Data.chapterById[ctx.chapterId]||Data.chapters[0];
    return { kind:'kb', intent:'INT-剧情',
      text:callName(ctx)+c.no+'「'+c.name+'」的任务是：'+c.mission+'我先给你一个方向——'+c.knowledgeNeeded,
      followUp:'你先去看看眼前这件文物，好吗？', sources:['章节任务'] };
  }
  function genHelp(ctx){
    var g=ctx.gameId?Data.gameById[ctx.gameId]:null;
    var hint=g&&g.hints&&g.hints[0]?g.hints[0]:'先仔细看看它的外形，找到最特别的那一处。';
    return { kind:'kb', intent:'INT-请求帮助',
      text:callName(ctx)+'我不直接给答案，先给你一个方向哦：'+hint,
      followUp:'试一下，再来找我！', sources:['关卡提示'] };
  }
  function genSensitive(ctx){
    return { kind:'kb', intent:'INT-敏感',
      text:callName(ctx)+Data.safety.nonviolenceLine,
      followUp:'你愿意试着「化解」它吗？', sources:[] };
  }
  function genNonsense(ctx){
    return { kind:'kb', intent:'INT-无意义',
      text:callName(ctx)+Data.safety.emptyLine+'大运河从两千多年前就开始挖啦，你想听哪一段？',
      followUp:'要不要我讲个运河小故事？', sources:[] };
  }

  /* ---- 三段边界话术（承认边界 → 不猜 → 拉回运河 + 求证入口） ---- */
  function boundary(){
    var s=Data.safety.boundary;
    return { kind:'boundary', intent:'INT-超纲',
      text:(s[0]||'')+' '+(s[1]||'')+' '+(s[2]||'')+' '+(s[3]||''),
      followUp:'你问我一件运河文物，我准能讲给你听。', sources:[] };
  }

  /* ---- 上下文记忆（只影响话术外壳，不影响事实内容） ---- */
  function warmUp(){
    var st=Store.state;
    var bodySeals=0; try{ Object.keys(st.progress.seals).forEach(function(k){ if(st.progress.seals[k]) bodySeals++; }); }catch(e){}
    var artsDone=0; try{ Object.keys(st.progress.artifacts||{}).forEach(function(k){ if(st.progress.artifacts[k].gameDone) artsDone++; }); }catch(e){}
    var dOpened=0; try{ Object.keys(st.progress.artifacts||{}).forEach(function(k){ var o=st.progress.artifacts[k].detailsOpened||{}; dOpened+=Object.keys(o).length; }); }catch(e){}
    var lr=st.progress.lastRoute||{};
    return {
      nickname:st.profile.nickname||'',
      commander:st.profile.commander||'',
      beast:st.pet.beast||'qinglong',
      stage:Data.stageFor(st.pet.energy),
      chapterId:lr.chapterId||null,
      actIndex:Util.safeNum(lr.actIndex,0),
      lastArtifactId:st.agent.lastArtifactId||null,
      turns:(st.agent.turns||[]).slice(-10),
      recentIntents:(st.agent.lastIntents||[]).slice(-5),
      artifactsDone:artsDone, detailsOpened:dOpened, seals:bodySeals
    };
  }
  function remember(turn){
    try{
      var st=Store.state;
      turn.t=Date.now();
      st.agent.turns.push(turn);
      if(st.agent.turns.length>40) st.agent.turns=st.agent.turns.slice(-30);
      if(turn.role==='kid'){
        if(turn.intent) { st.agent.lastIntents.push(turn.intent); if(st.agent.lastIntents.length>12) st.agent.lastIntents=st.agent.lastIntents.slice(-12); }
        if(turn.intent) st.agent.intentCounts[turn.intent]=(st.agent.intentCounts[turn.intent]||0)+1;
        if(turn.artifactId){ st.agent.lastArtifactId=turn.artifactId; }
        if(turn.intent==='INT-超纲') st.agent.boundaryCount=(st.agent.boundaryCount||0)+1;
        if(turn.intent==='INT-索取夸奖') st.agent.praiseCount=(st.agent.praiseCount||0)+1;
      }
      Store.saveState();
    }catch(e){}
  }

  /* ---- 主入口 ---- */
  function respond(text){
    var ctx=warmUp();
    var cls=classify(text,ctx);
    var out;
    if(cls.key==='boundary'){ out=boundary(); }
    else if(cls.key==='sensitive'){ out=genSensitive(ctx); }
    else if(cls.key==='nonsense'){
      var ff=findByText(text);
      if(ff&&ff.kind==='artifact') out=genArtifact(Data.artifactById[ff.id],ctx);
      else if(ff&&ff.kind==='topic') out=genTopic(Data.topicById[ff.id],ctx);
      else out=genNonsense(ctx);
    }
    else if(cls.key==='artifact'){ var aa=retrieveArtifact(text,ctx); out=aa?genArtifact(aa,ctx):genArtifactList(ctx); }
    else if(cls.key==='extend'){ var tp=retrieveTopic(text); out=tp?genTopic(tp,ctx):boundary(); }
    else if(cls.key==='venue'){ out=genVenue(ctx); }
    else if(cls.key==='greet'){ out=genGreet(ctx); }
    else if(cls.key==='pet'){ out=genPet(ctx); }
    else if(cls.key==='emotion'){ out=genEmotion(ctx); }
    else if(cls.key==='praise'){ out=genPraise(ctx); }
    else if(cls.key==='story'){ out=genStory(ctx); }
    else if(cls.key==='help'){ out=genHelp(ctx); }
    else { out=boundary(); }

    /* 指代消解兜底：若为文物意图但未解析出文物，则退回边界（绝不编造） */
    if(out.kind==='kb'&&out.intent==='INT-文物'&&!(out.sources||[]).length){ out=boundary(); }

    var artId=null;
    if(out.intent==='INT-文物'){ var a=findByText(text); if(a&&a.kind==='artifact') artId=a.id; else artId=ctx.lastArtifactId; }
    remember({ role:'kid', text:String(text||''), intent:cls.intentId, artifactId:artId });
    remember({ role:'pet', text:out.text, intent:cls.intentId });

    try{
      Store.logEvent({ type: out.kind==='boundary'?'boundary':'chat', intent:cls.intentId,
        literacy: (Data.intentById[cls.intentId]||{}).literacy||null, textLen:String(text||'').length });
    }catch(e){}
    Util.bus.emit('agent:reply',out);
    return out;
  }

  return { classify:classify, retrieve:function(text){ return findByText(text); }, resolve:function(t){ return hasPronoun(norm(t)); },
           generate:function(t,ctx){ return respond(t); }, remember:remember, boundary:boundary, respond:respond,
           warmUp:warmUp, _findByText:findByText };
})();

/* ============================================================
 * M7 · Pet（方位游动 + 点击反应 FSM + toPerch + 被夸特效 + 定制回写）
 * 单击 = 打滚/冒话（45%/55%，1.5s 冷却，近 3 次去重）
 * 长按 ≥600ms 或冒话气泡「聊聊」按钮 = 进入对话
 * 前 3 次单击灵宠主动提示「长按我，可以跟我聊天哦」
 * ============================================================ */
var Pet=(function(){
  var btn=null, bubble=null, cooldownMs=1500, pressTimer=null, longFired=false, downAt=0, perched=false, mounted=false;

  function b(){ return Data.beasts[(Store.state&&Store.state.pet.beast)||'qinglong']||Data.beasts.qinglong; }
  function palette(){
    var c=(Store.state&&Store.state.pet.custom)||{};
    var p=c.palette||{};
    if(p.main&&p.accent) return { main:p.main, accent:p.accent };
    return null;
  }
  function stage(){ return Data.stageFor(Store.state.pet.energy); }

  function place(){
    if(!btn) return;
    var w=window.innerWidth, h=window.innerHeight, S=perched?58:96;
    var left,top;
    var dir=b().dir;
    if(perched){
      if(dir==='west'){ left=w-S-10; top=h-S-150; }
      else if(dir==='south'){ left=w-S-10; top=100; }
      else if(dir==='north'){ left=10; top=h-S-150; }
      else { left=10; top=h-S-150; }
    } else {
      if(dir==='east'){ left=14; top=Math.round(h*0.5-S/2); }
      else if(dir==='west'){ left=w-S-14; top=Math.round(h*0.5-S/2); }
      else if(dir==='south'){ left=Math.round(w*0.5-S/2); top=h-S-88; }
      else { left=Math.round(w*0.5-S/2); top=92; }
    }
    btn.style.left=left+'px'; btn.style.top=top+'px';
    if(bubble){
      var bw=Math.min(250,w-40);
      if(left> w/2) bubble.style.right=(w-left-S-8)+'px', bubble.style.left='auto';
      else bubble.style.left=(left+S+8)+'px', bubble.style.right='auto';
      bubble.style.top=Math.max(70,top-8)+'px';
      bubble.style.maxWidth=bw+'px';
    }
  }

  function render(){
    if(!btn) return;
    var mood='calm';
    var ml=null;
    btn.innerHTML=Assets.petSVG({ beast:(Store.state.pet.beast||'qinglong'), stage:stage(), palette:palette(), mood:mood, moodLayer:ml });
    if(!Store.state.pet.beast) btn.setAttribute('title','尚未选定守护灵宠');
    btn.classList.toggle('mirror',b().dir==='west');
  }
  function mount(){
    if(mounted){ place(); return; }
    var layer=Util.$('#petLayer'); if(!layer) return;
    btn=document.createElement('button');
    btn.id='petBtn'; btn.className='pet-btn'; btn.type='button';
    btn.setAttribute('aria-label','灵宠·'+b().name+'，点击互动，长按对话');
    btn.innerHTML=Assets.petSVG({ beast:(Store.state.pet.beast||'qinglong'), stage:stage(), palette:palette() });
    btn.style.animationName='';
    layer.appendChild(btn);

    bubble=document.createElement('div');
    bubble.id='petBubble'; bubble.className='pet-bubble'; bubble.setAttribute('role','status');
    layer.appendChild(bubble);

    bindGestures();
    swim(b().swim||b().dir);
    place();
    window.addEventListener('resize',place);
    mounted=true;
  }
  function bindGestures(){
    btn.addEventListener('pointerdown',function(e){
      if(e.button!=null&&e.button!==0) return;
      longFired=false; downAt=Date.now();
      clearTimeout(pressTimer);
      pressTimer=setTimeout(function(){ longFired=true; onLongPress(); },600);
    });
    btn.addEventListener('pointerup',function(e){
      clearTimeout(pressTimer);
      var dur=Date.now()-downAt;
      if(!longFired && dur<600){ onTap(); }
      longFired=false;
    });
    btn.addEventListener('pointerleave',function(){ clearTimeout(pressTimer); });
    btn.addEventListener('pointercancel',function(){ clearTimeout(pressTimer); });
    btn.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onTap(); }
    });
  }

  function swim(zone){
    if(!btn) return;
    ['east','west','south','north'].forEach(function(z){ btn.classList.remove('swim-'+z); });
    zone=zone||b().swim||b().dir;
    btn.classList.add('swim-'+zone);
  }
  function toPerch(){
    if(!btn) return; perched=true; btn.classList.add('perched'); hideBubble(); place();
  }
  function unPerch(){
    if(!btn) return; perched=false; btn.classList.remove('perched'); place();
  }

  function hideBubble(){ if(bubble){ bubble.classList.remove('show'); } }
  function showBubble(text,withChat){
    if(!bubble) return;
    var html=Util.esc(text);
    if(withChat) html+='<button class="btn sm jade chat-cta" type="button" id="petChatCta">聊聊</button>';
    bubble.innerHTML=html;
    bubble.classList.add('show');
    var cta=Util.$('#petChatCta');
    if(cta) cta.onclick=function(ev){ ev.stopPropagation(); hideBubble(); onLongPress(); };
    clearTimeout(bubble._t);
    bubble._t=setTimeout(function(){ bubble.classList.remove('show'); },5200);
  }

  function pickSay(){
    var st=Store.state, beast=b();
    var pool=[];
    var lr=(st.progress&&st.progress.lastRoute)||{};
    if(st.agent.lastArtifactId&&beast.context&&beast.context.artifact) pool=pool.concat(beast.context.artifact);
    if(lr.chapterId&&beast.context&&beast.context.chapter) pool=pool.concat(beast.context.chapter);
    pool=pool.concat(beast.says||[]);
    pool=pool.concat([beast.motto]);
    var recent=(st.pet.lastLines||[]);
    var filtered=pool.filter(function(l){ return recent.indexOf(l)<0; });
    var line=Util.pick(filtered.length?filtered:pool)||beast.motto;
    st.pet.lastLines=(recent.concat([line])).slice(-3);
    return line;
  }

  /* ---- 点击反应 FSM ---- */
  function onTap(){
    if(!btn) return;
    var now=Date.now(), st=Store.state;
    if(now-Util.safeNum(st.pet.lastReactAt,0) < cooldownMs) return;   /* 冷却内不响应 */
    st.pet.lastReactAt=now;

    /* 前 3 次单击：主动提示进入对话的方法 */
    var hints=Util.safeNum(st.pet.onboardingHintCount,0);
    if(hints<3){
      st.pet.onboardingHintCount=hints+1;
      react('say','长按我，可以跟我聊天哦（也可以点这里的「聊聊」）',true);
      Store.saveState();
      return;
    }
    var r=Math.random();
    if(r<0.55) react('say');
    else react('roll');
    Store.saveState();
  }
  function react(kind,text,withChat){
    if(!btn) return;
    if(kind==='roll'){
      var t=(b().tapReacts[0]&&b().tapReacts[0].spec)||'roll';
      btn.classList.remove('react-roll'); void btn.offsetWidth; btn.classList.add('react-roll');
      Audio.play('rotate_click');
      setTimeout(function(){ if(btn) btn.classList.remove('react-roll'); },950);
      showBubble(Text['rollLine'](b()),true);
    } else {
      var line=text||pickSay();
      showBubble(line,withChat!==false);
      Audio.play('ui_tap');
    }
    Util.bus.emit('pet:react',{kind:kind});
  }
  function onLongPress(){
    hideBubble();
    if(typeof ChatOverlay!=='undefined'&&ChatOverlay.open) ChatOverlay.open();
  }
  function celebrate(){
    if(!btn) return;
    btn.classList.remove('celebrate'); void btn.offsetWidth; btn.classList.add('celebrate');
    Audio.play('seal');
    showBubble(b().praiseText,false);
    setTimeout(function(){ if(btn) btn.classList.remove('celebrate'); },1700);
  }
  function applyCustom(custom){
    custom=custom||(Store.state.pet.custom||{});
    if(custom.palette&&custom.palette.main) Store.state.pet.custom.palette=custom.palette;
    render();
  }

/* ============================================================
 * M5 · Overlays（弹层栈 + scrim + 焦点锁 + 互斥）
 * ============================================================ */
var Overlays=(function(){
  var stack=[], registry={};
  function register(id,def){ registry[id]=def||{}; }
  function isOpen(id){ return stack.some(function(s){ return s.id===id; }); }
  function current(){ return stack.length?stack[stack.length-1]:null; }
  function lock(){ try{ document.body.setAttribute('data-lock','1'); }catch(e){} }
  function unlock(){ if(!stack.length){ try{ document.body.removeAttribute('data-lock'); }catch(e){} } }
  function paint(){
    var el=Util.$('#overlayRoot'), scrim=Util.$('#scrim');
    if(!stack.length){ el.classList.remove('show'); el.hidden=true; el.innerHTML=''; scrim.classList.remove('show'); unlock(); return; }
    var top=stack[stack.length-1], def=registry[top.id]||{};
    el.hidden=false; el.classList.add('show');
    el.setAttribute('aria-label',top.opts.label||def.label||'弹层');
    el.innerHTML=def.render?def.render(top.opts):'';
    scrim.classList.add('show');
    scrim.classList.toggle('dismissable',def.dismissable!==false);
    if(def.onMount){ try{ def.onMount(el,top.opts); }catch(e){ Util.bus.emit('overlay:error',e); } }
  }
  function open(id,opts){
    opts=opts||{};
    var def=registry[id]; if(!def) return false;
    if(isOpen(id)) return true;
    if(def.exclusive){ stack.slice().forEach(function(s){ if(registry[s.id]&&!registry[s.id].exclusive) close(s.id,true); }); }
    var prevFocus=null; try{ prevFocus=document.activeElement; }catch(e){}
    stack.push({ id:id, opts:opts, prevFocus:prevFocus });
    paint(); lock();
    var el=Util.$('#overlayRoot');
    if(el){ el.onclick=function(e){ if(e.target===el&&def.dismissable!==false) close(id); }; }
    Util.bus.emit('overlay:open',{ id:id });
    return true;
  }
  function close(id,silent){
    var idx=-1; for(var i=stack.length-1;i>=0;i--){ if(stack[i].id===id){ idx=i; break; } }
    if(idx<0) return false;
    var entry=stack.splice(idx,1)[0];
    paint();
    if(!stack.length&&!silent){ try{ if(entry.prevFocus&&entry.prevFocus.focus) entry.prevFocus.focus(); }catch(e){} }
    Util.bus.emit('overlay:close',{ id:id });
    return true;
  }
  function closeTop(){ var c=current(); if(c) return close(c.id); return false; }
  return { register:register, open:open, close:close, closeTop:closeTop, isOpen:isOpen, current:current, lock:lock, unlock:unlock, stackDepth:function(){ return stack.length; } };
})();

/* ============================================================
 * M6 · Router（路由表 + 屏栈 + 章内 deck + lastRoute 恢复）
 * ============================================================ */
var Router=(function(){
  var routes={}, stack=[], curRoute=null;
  function register(r){ if(r&&r.id) routes[r.id]=r; return r; }
  function stage(){ return Util.$('#stage'); }
  function routeOf(id){ return routes[id]||null; }
  function persist(){
    try{
      var ch=Stack.lastChapter();
      var lr={ stackIds:stack.map(function(s){ return s.id; }), chapterId:null, actIndex:0 };
      if(ch){ lr.chapterId=(ch.params&&ch.params.chapterId)||null; lr.actIndex=Util.safeNum(ch.deckIndex,0); }
      Store.state.progress.lastRoute=lr;
      Store.saveState();
    }catch(e){}
  }
  /* 小工具：查栈 */
  var Stack={
    last:function(id){ for(var i=stack.length-1;i>=0;i--){ if(stack[i].id===id) return stack[i]; } return null; },
    lastChapter:function(){ for(var i=stack.length-1;i>=0;i--){ if(/^screen-ch/.test(stack[i].id)) return stack[i]; } return null; },
    has:function(id){ return !!Stack.last(id); }
  };
  function renderTop(){
    var top=stack[stack.length-1]; if(!top) return;
    var r=routeOf(top.id); if(!r){ return; }
    if(curRoute&&curRoute.onExit){ try{ curRoute.onExit(); }catch(e){} }
    var host=stage();
    var html=r.html?r.html(top.params||{}):'';
    host.innerHTML='<div class="screen" id="'+top.id+'" data-kind="'+(r.kind||'')+'">'+(html||'')+'</div>';
    curRoute=r;
    if(r.onMount){ try{ r.onMount(Util.$('#'+top.id),top.params||{}); }catch(e){ Util.bus.emit('route:error',{id:top.id,error:e}); } }
    if(r.onEnter){ try{ r.onEnter(top.params||{}); }catch(e){} }
    persist();
    Util.bus.emit('route:change',{ id:top.id, params:top.params });
  }
  /* A2: 屏栈深度守卫（上限 3）。策略：先出栈再入——栈满时移除「根屏之外最旧的一屏」，
     保证根屏（启动）与最新一次导航始终可用，避免用户点章节被直接拒绝。 */
  var MAX_DEPTH=3;
  function push(id,params){
    if(!routes[id]) return false;
    if(stack.length>=MAX_DEPTH){
      /* 保留根屏 stack[0]，移除次旧屏，再入栈 */
      if(stack.length>1) stack.splice(1,1);
      else stack.shift();
    }
    stack.push({ id:id, params:params||{}, deckIndex:0 });
    try{ history.pushState({ canal:true, id:id }, '', '#'+id); }catch(e){}
    renderTop();
    return true;
  }
  function replace(id,params){
    if(!routes[id]) return false;
    stack.pop();
    stack.push({ id:id, params:params||{}, deckIndex:0 });
    try{ history.replaceState({ canal:true, id:id },'','#'+id); }catch(e){}
    renderTop();
    return true;
  }
  /* A4: back() 与 popstate 单一弹栈路径（suppressPop 抑制二次弹栈） */
  var suppressPop=false;
  function back(){
    if(stack.length<=1) return false;
    stack.pop();
    suppressPop=true;
    try{ history.back(); }catch(e){ suppressPop=false; }
    renderTop();
    return true;
  }
  function setAct(i){
    var top=stack[stack.length-1]; if(!top) return false;
    top.deckIndex=Util.clamp(i,0,999);
    var r=routeOf(top.id);
    if(r&&r.onAct){ try{ r.onAct(top.deckIndex,top.params||{}); }catch(e){} }
    persist();
    return true;
  }
  /* A3: restore 需回填末个 chapter 屏的 params.chapterId（原实现 params 全为 {}） */
  function restore(lr){
    if(!lr||!Array.isArray(lr.stackIds)||!lr.stackIds.length) return false;
    var ids=lr.stackIds.filter(function(id){ return !!routes[id]; });
    if(!ids.length) return false;
    var lastCh=-1;
    for(var i=0;i<ids.length;i++){ if(/^screen-ch/.test(ids[i])) lastCh=i; }
    stack=ids.map(function(id,idx){
      var params={};
      if(idx===lastCh&&lr.chapterId) params.chapterId=lr.chapterId;
      return { id:id, params:params, deckIndex:(idx===ids.length-1?Util.safeNum(lr.actIndex,0):0) };
    });
    renderTop();
    return true;
  }
  function current(){ return stack.length?stack[stack.length-1]:null; }
  function stackIds(){ return stack.map(function(s){ return s.id; }); }
  function handleKey(e){
    if(e.key!=='Escape') return;
    if(Overlays.stackDepth()>0){ Overlays.closeTop(); e.preventDefault(); return; }
    back();
  }
  function installGlobal(){
    try{ history.replaceState({ canal:true, boot:true },'','#'+(stack.length?stack[stack.length-1].id:'screen-launch')); }catch(e){}
    window.addEventListener('popstate',function(){
      if(suppressPop){ suppressPop=false; return; }   /* 已由 back() 弹栈，避免双弹 */
      if(stack.length>1){ stack.pop(); renderTop(); }
    });
    document.addEventListener('keydown',handleKey);
    Util.$('#scrim').addEventListener('click',function(){ var c=Overlays.current(); if(!c) return; var d=true; try{ d=(Overlays.current()&&true); }catch(e){} Overlays.closeTop(); });
  }
  return { register:register, push:push, back:back, replace:replace, setAct:setAct, restore:restore,
           current:current, stackIds:stackIds, routes:routes, installGlobal:installGlobal, _Stack:Stack };
})();

/* ============================================================
 * M12a · Primitives（9 个交互原语：纯交互，绝不自行结算）
 * dragDrop / tapRhythm / slider / rotate / charge / connect / trace / magnifier / counter
 * ============================================================ */
var Primitives=(function(){
  function ans(inst,tk){ return inst.ans[tk]||(inst.ans[tk]={}); }

  function seqEval(task,inst,tk){
    var m=inst.misc[tk]||{seq:[]}, order=task.order||[], right=0;
    for(var i=0;i<order.length;i++){ if(m.seq[i]===order[i]) right++; else break; }
    return { done:(right===order.length&&m.seq.length===order.length), right:right, total:order.length };
  }
  function seqBind(host,task,inst,tk,ctx){
    var m=inst.misc[tk]||(inst.misc[tk]={seq:[]});
    Util.$$('[data-node]',host).forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-node');
        if(m.seq.indexOf(id)>=0){ m.seq=m.seq.filter(function(x){ return x!==id; }); }
        else { m.seq.push(id); Audio.play('rotate_click'); }
        ctx.repaint(tk);
      };
    });
  }

  /* ---------- 1) dragDrop：把元件放到对应槽位（拖拽 / 点选皆可） ---------- */
  var dragDrop={
    render:function(task,inst,tk){
      var a=ans(inst,tk);
      /* 一次性动效标记（落位/回弹），读后即清，repaint 重建 DOM 也不会丢 */
      var fx=inst.misc[tk+'__fx']||{}; inst.misc[tk+'__fx']=null;
      var chips=(task.chips||[]).map(function(c){
        var to=a[c.id];
        var cls='p-chip'+(to?' used':'')+(to&&fx.landChip===c.id?' landed':'')+(!to&&fx.bounceChip===c.id?' bounce':'');
        return '<button class="'+cls+'" type="button" data-chip="'+Util.esc(c.id)+'"'+(to?' aria-pressed="true"':'')+'>'+Util.esc(c.t||c.label)+'</button>';
      }).join('');
      var slots=(task.slots||[]).map(function(s){
        var got=(task.chips||[]).filter(function(c){ return a[c.id]===s.k; });
        return '<button class="p-slot'+((got.length)?' filled':'')+(got.length&&fx.landSlot===s.k?' land':'')+'" type="button" data-slot="'+Util.esc(s.k)+'">'+
          '<span class="p-slot-lb">'+Util.esc(s.label)+'</span>'+
          '<span class="p-slot-v">'+((got.length)?got.map(function(c){ return Util.esc(c.t||c.label); }).join('、'):'放这里')+'</span></button>';
      }).join('');
      return '<div class="p-drag"><div class="p-chips">'+chips+'</div><div class="p-slots">'+slots+'</div>'+
        '<p class="p-tip muted">把元件拖到对应的位置；也可以先点元件、再点位置。</p></div>';
    },
    bind:function(host,task,inst,tk,ctx){
      var sel=null;
      function chipEls(){ return Util.$$('[data-chip]',host); }
      function paintSel(){ chipEls().forEach(function(c){ c.classList.toggle('sel', c.getAttribute('data-chip')===sel); }); }
      function fx(o){ inst.misc[tk+'__fx']=o||{}; }
      function assign(chipId,slotKey){ ans(inst,tk)[chipId]=slotKey; fx({ landChip:chipId, landSlot:slotKey }); ctx.repaint(tk); }
      function slotAt(x,y){ var L=Util.$$('[data-slot]',host);
        for(var i=0;i<L.length;i++){ var r=L[i].getBoundingClientRect(); if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return L[i]; } return null; }
      host.addEventListener('pointerdown',function(e){
        var chip=e.target.closest('[data-chip]'); if(!chip) return;
        e.preventDefault();
        var id=chip.getAttribute('data-chip'), sx=e.clientX, sy=e.clientY, moved=false, ghost=null;
        function mv(ev){
          if(!moved&&(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy))>6){
            moved=true; ghost=chip.cloneNode(true); ghost.className='p-ghost';
            ghost.setAttribute('aria-hidden','true'); document.body.appendChild(ghost);
            chip.classList.add('dragging');            /* 拾起：原位置淡出 */
          }
          if(moved){
            ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';   /* 幽灵块带放大+投影+倾斜（CSS .p-ghost） */
            var over=slotAt(ev.clientX,ev.clientY);
            Util.$$('[data-slot]',host).forEach(function(s){ s.classList.toggle('hot', s===over); });   /* 吸附槽高亮 */
            ghost.classList.toggle('over-slot', !!over);                                                /* 对准时投影转青 */
          }
        }
        function up(ev){
          document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
          if(ghost){ try{ ghost.remove(); }catch(_){} } chip.classList.remove('dragging');
          Util.$$('[data-slot]',host).forEach(function(s){ s.classList.remove('hot'); });
          if(moved){
            var s=slotAt(ev.clientX,ev.clientY);
            if(s) assign(id,s.getAttribute('data-slot'));                                  /* 落位：回弹 + 槽闪光 */
            else { fx({ bounceChip:id }); ctx.repaint(tk); Toast('把元件拖到右边的格子里哦'); }   /* 场外：弹回 + 提示 */
          }
          else { sel=(sel===id)?null:id; paintSel(); }
        }
        document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
      });
      host.addEventListener('click',function(e){
        var s=e.target.closest('[data-slot]');
        if(s){ if(sel){ assign(sel, s.getAttribute('data-slot')); sel=null; }
          else { var a=ans(inst,tk); for(var k in a){ if(a[k]===s.getAttribute('data-slot')){ delete a[k]; break; } } ctx.repaint(tk); } return; }
        var c=e.target.closest('[data-chip]'); if(!c) return;
        var id=c.getAttribute('data-chip'); if(ans(inst,tk)[id]){ delete ans(inst,tk)[id]; ctx.repaint(tk); return; }
        sel=(sel===id)?null:id; paintSel();
      });
    },
    evaluate:function(task,inst,tk){
      var a=ans(inst,tk), right=0, total=(task.chips||[]).length;
      (task.chips||[]).forEach(function(c){ if(a[c.id]===c.to) right++; });
      return { done:total>0&&right===total, right:right, total:total };
    },
    solve:function(task,inst,tk){ var a=ans(inst,tk); (task.chips||[]).forEach(function(c){ a[c.id]=c.to; }); },
    reset:function(task,inst,tk){ inst.ans[tk]={}; }
  };

  /* ---------- 2) tapRhythm：跟着节拍点击（判定窗读 Data.timing.rhythm） ---------- */
  var tapRhythm={
    render:function(task,inst,tk){
      var m=inst.misc[tk]||(inst.misc[tk]={taps:[]});
      var beats=task.beats||[];
      var marks=beats.map(function(){ return '<span class="p-beat"></span>'; }).join('');
      return '<div class="p-rhythm"><div class="p-beats" data-beats>'+marks+'</div>'+
        '<button class="p-bell" type="button" data-bell aria-label="摇铃">'+
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a5 5 0 0 1 5 5v3l2 3H5l2-3V8a5 5 0 0 1 5-5Z" fill="#C8963E" stroke="#8A6420" stroke-width="1.2"/><path d="M10 17a2 2 0 0 0 4 0" fill="none" stroke="#8A6420" stroke-width="1.4"/></svg>'+
          '<span class="p-bell-lb">摇铃</span></button>'+
        '<div class="p-rhythm-ctl"><button class="btn ghost sm" type="button" data-guide>跟着打一遍</button>'+
        '<span class="muted" data-tapcount>已摇 '+m.taps.length+' 次</span></div>'+

    },
    bind:function(host,task,inst,tk,ctx){
      var m=inst.misc[tk]||(inst.misc[tk]={taps:[],started:false,t0:0,scheduled:[]});
      function pulse(i){ var bs=Util.$$('.p-beat',host); if(bs[i]){ bs[i].classList.remove('pulse'); void bs[i].offsetWidth; bs[i].classList.add('pulse'); } }
      var guide=Util.$('[data-guide]',host);
      if(guide) guide.onclick=function(){
        Audio.resume(); Audio.play('ui_tap');
        (m.scheduled||[]).forEach(function(id){ clearTimeout(id); }); m.scheduled=[];
        (task.beats||[]).forEach(function(ms,i){ m.scheduled.push(setTimeout(function(){ pulse(i); Audio.play('bell_ring'); }, ms)); });
        inst.timers.push(m.scheduled);
      };
      var bell=Util.$('[data-bell]',host);
      if(bell) bell.onclick=function(){
        Audio.resume();
        if(!m.started){ m.started=true; m.t0=performance.now(); }

        pulse(Math.min(m.taps.length-1,(task.beats||[]).length-1));
        var tc=Util.$('[data-tapcount]',host); if(tc) tc.textContent='已摇 '+m.taps.length+' 次';
      };
    },
    evaluate:function(task,inst,tk){
      var m=inst.misc[tk]||{taps:[]}, beats=task.beats||[], win=Data.timing.rhythm.pass;
      var devs=m.taps.map(function(t){ var best=Infinity; beats.forEach(function(b){ best=Math.min(best, Math.abs(t-b)); }); return best; });
      var hits=0; devs.forEach(function(dd){ if(dd<=win) hits++; });
      var countOk=(m.taps.length===beats.length);
      var done=countOk&&hits===beats.length&&beats.length>0;
      m.maxDev=devs.length?Math.max.apply(null,devs):Infinity;
      return { done:done, right:(done?beats.length:hits), total:beats.length };
    },
    solve:function(task,inst,tk){ var m=inst.misc[tk]||(inst.misc[tk]={}); m.taps=(task.beats||[]).slice(); m.maxDev=0; },
    reset:function(task,inst,tk){ inst.misc[tk]={taps:[],started:false,t0:0,scheduled:[]}; }
  };

  /* ---------- 3) slider：把线索变成数字密码 ---------- */
  var slider={
    render:function(task,inst,tk){
      var a=ans(inst,tk);

        var mid=Math.floor((d.min+d.max)/2), v=(d.k in a)?a[d.k]:mid;
        return '<label class="p-dial"><span>'+Util.esc(d.label)+'</span>'+
          '<input type="range" min="'+d.min+'" max="'+d.max+'" step="1" value="'+v+'" data-dial="'+Util.esc(d.k)+'" aria-label="'+Util.esc(d.label)+'"><b data-dialv="'+Util.esc(d.k)+'">'+v+'</b></label>';
      }).join('');

        '<p class="p-tip muted">把两条线索变成数字密码。</p></div>';
    },
    bind:function(host,task,inst,tk,ctx){
      Util.$$('[data-dial]',host).forEach(function(inp){
        inp.oninput=function(){
          var k=inp.getAttribute('data-dial'); ans(inst,tk)[k]=Number(inp.value);
          var b=Util.$('[data-dialv="'+k+'"]',host); if(b) b.textContent=inp.value;

      return { done:total>0&&right===total, right:right, total:total };
    },
    solve:function(task,inst,tk){ var a=ans(inst,tk); (task.dials||[]).forEach(function(d){ a[d.k]=d.target; }); },
    reset:function(task,inst,tk){ inst.ans[tk]={}; }

  /* ---------- 4) rotate：转到正确角度 ---------- */
  var rotate={
    render:function(task,inst,tk){
      var v=Util.safeNum(ans(inst,tk).angle,0);
      return '<div class="p-rotate"><div class="p-rot-stage"><div class="p-rot-obj" data-rotobj style="transform:rotate('+v+'deg)">'+
        '<svg viewBox="0 0 120 120" role="img" aria-label="燕尾扣"><path d="M60 16 C38 42 22 62 22 80 C22 98 40 108 60 108 C80 108 98 98 98 80 C98 62 82 42 60 16 Z" fill="#D9B27C" stroke="#8A6F45" stroke-width="3"/><path d="M60 40 v48" stroke="#8A6F45" stroke-width="3"/></svg></div>'+
        '<div class="p-rot-target" aria-hidden="true"></div></div>'+
        '<input type="range" min="0" max="180" step="1" value="'+v+'" data-rot aria-label="旋转燕尾扣"><b data-rotv>'+Math.round(v)+'°</b>'+
        '<p class="p-tip muted">转动燕尾扣，让两翼对准石缝。</p></div>';
    },
    bind:function(host,task,inst,tk,ctx){
      var inp=Util.$('[data-rot]',host); if(!inp) return;
      inp.oninput=function(){
        ans(inst,tk).angle=Number(inp.value);

    evaluate:function(task,inst,tk){

    solve:function(task,inst,tk){ ans(inst,tk).angle=Util.safeNum(task.target,0); },
    reset:function(task,inst,tk){ inst.ans[tk]={}; }

  /* ---------- 5) charge：蓄力到绿区（绿区读 Data.timing.winch） ---------- */
  var charge={
    render:function(task,inst,tk){
      var m=inst.misc[tk]||(inst.misc[tk]={force:0});
      var g=Data.timing.winch, lo=(g.greenLow*100), hi=(g.greenHigh*100);
      return '<div class="p-charge"><div class="p-meter"><div class="p-green" style="left:'+lo+'%;width:'+(hi-lo)+'%"></div><div class="p-force" data-force style="width:'+Math.round(m.force*100)+'%"></div></div>'+
        '<div class="row"><button class="btn jade" type="button" data-hold>按住 · 蓄力</button><span class="muted" data-forcev>力气 '+Math.round(m.force*100)+'%</span></div>'+
        '<p class="p-tip muted">快点几下，或按住"蓄力"，把力气停进绿区。</p></div>';
    },
    bind:function(host,task,inst,tk,ctx){
      var m=inst.misc[tk]||(inst.misc[tk]={force:0});

      var timer=null;
      function paint(){ var f=Util.$('[data-force]',host); if(f) f.style.width=Math.round(m.force*100)+'%';
        var v=Util.$('[data-forcev]',host); if(v) v.textContent='力气 '+Math.round(m.force*100)+'%'; }
      function start(){ if(timer) return; timer=setInterval(function(){ m.force=Math.min(1,m.force+0.04); paint(); },60); inst.timers.push(timer); }
      function stop(){ if(timer){ clearInterval(timer); timer=null; } }
      btn.addEventListener('pointerdown',function(e){ e.preventDefault(); start(); });
      btn.addEventListener('pointerup',stop); btn.addEventListener('pointerleave',stop); btn.addEventListener('pointercancel',stop);

    evaluate:function(task,inst,tk){

    solve:function(task,inst,tk){ var g=Data.timing.winch; (inst.misc[tk]||(inst.misc[tk]={})).force=(g.greenLow+g.greenHigh)/2; },

  var connect={
    render:function(task,inst,tk){
      var m=inst.misc[tk]||(inst.misc[tk]={seq:[]});
      var nodes=(task.nodes||[]).map(function(n){
        var i=m.seq.indexOf(n.id);

      return '<div class="p-connect"><div class="p-nodes">'+nodes+'</div>'+
        '<div class="p-seq">已连 '+m.seq.length+' / '+(task.order||[]).length+'</div>'+
        '<p class="p-tip muted">按正确的顺序，一个一个点。</p></div>';
    },
    bind:seqBind, evaluate:seqEval,
    solve:function(task,inst,tk){ (inst.misc[tk]||(inst.misc[tk]={})).seq=(task.order||[]).slice(); },
    reset:function(task,inst,tk){ inst.misc[tk]={seq:[]}; }
  };

  /* ---------- 7) trace：沿针法规律描线（渲染不同，判定同 connect） ---------- */
  var trace={
    render:function(task,inst,tk){
      var m=inst.misc[tk]||(inst.misc[tk]={seq:[]});
      var nodes=(task.nodes||[]).map(function(n){
        var i=m.seq.indexOf(n.id);
        return '<button class="p-node p-stitch'+(i>=0?' on':'')+'" type="button" data-node="'+Util.esc(n.id)+'" aria-label="第 '+Util.esc(n.t)+' 针">'+(i>=0?('<b>'+(i+1)+'</b>'):'')+Util.esc(n.t||'')+'</button>';
      }).join('');
      return '<div class="p-connect p-trace"><div class="p-stitch-line" aria-hidden="true"></div><div class="p-nodes">'+nodes+'</div>'+
        '<div class="p-seq">已连 '+m.seq.length+' / '+(task.order||[]).length+' 针</div>'+

    },
    bind:seqBind, evaluate:seqEval,
    solve:function(task,inst,tk){ (inst.misc[tk]||(inst.misc[tk]={})).seq=(task.order||[]).slice(); },
    reset:function(task,inst,tk){ inst.misc[tk]={seq:[]}; }
  };

  /* ---------- 8) magnifier：找出隐藏的铭文凹槽 ---------- */
  var magnifier={
    render:function(task,inst,tk){
      var m=inst.misc[tk]||(inst.misc[tk]={found:[]});
      var spots=(task.spots||[]).map(function(s){
        var f=m.found.indexOf(s.id)>=0;
        return '<button class="p-spot'+(f?' found':'')+'" type="button" data-spot="'+Util.esc(s.id)+'" style="left:'+s.x+'%;top:'+s.y+'%" aria-label="用放大镜检查这里">'+(f?'✓':'')+'</button>';
      }).join('');
      return '<div class="p-magnifier"><div class="p-mag-scene">'+
        '<svg viewBox="0 0 200 200" role="img" aria-label="林工铁锭"><rect x="30" y="56" width="140" height="88" rx="12" fill="#5A6169" stroke="#2E353B" stroke-width="3"/><rect x="46" y="70" width="108" height="60" rx="6" fill="#6E7680" opacity=".6"/></svg>'+spots+'</div>'+
        '<div class="p-seq">已找到 '+m.found.length+' / '+(task.spots||[]).length+' 处</div>'+
        '<p class="p-tip muted">用放大镜逐处检查铁锭表面。</p></div>';
    },
    bind:function(host,task,inst,tk,ctx){
      var m=inst.misc[tk]||(inst.misc[tk]={found:[]});
      Util.$$('[data-spot]',host).forEach(function(b){
        b.onclick=function(){ var id=b.getAttribute('data-spot'); if(m.found.indexOf(id)<0){ m.found.push(id); Audio.play('ui_tap'); ctx.repaint(tk); } };
      });

    evaluate:function(task,inst,tk){
      var m=inst.misc[tk]||{found:[]}, total=(task.spots||[]).length, right=m.found.length;
      return { done:total>0&&right>=total, right:right, total:total };
    },
    solve:function(task,inst,tk){ (inst.misc[tk]||(inst.misc[tk]={})).found=(task.spots||[]).map(function(s){ return s.id; }); },
    reset:function(task,inst,tk){ inst.misc[tk]={found:[]}; }
  };

  /* ---------- 9) counter：逐件点数 ---------- */
  var counter={
    render:function(task,inst,tk){
      var m=inst.misc[tk]||(inst.misc[tk]={count:0});
      var total=Util.safeNum(task.total,6), bags=[];
      for(var i=1;i<=total;i++){ bags.push('<button class="p-bag" type="button" data-bag="'+i+'">第 '+i+' 包</button>'); }
      return '<div class="p-counter"><div class="p-bags">'+bags.join('')+'</div>'+
        '<div class="p-count"><b data-count>'+m.count+'</b> / '+total+' 斛</div>'+
        '<p class="p-tip muted">把每包粮倒进官斛，数清一共几斛。</p></div>';
    },
    bind:function(host,task,inst,tk,ctx){
      var m=inst.misc[tk]||(inst.misc[tk]={count:0});
      Util.$$('[data-bag]',host).forEach(function(b){
        b.onclick=function(){
          if(b.classList.contains('on')) return;
          b.classList.add('on'); m.count++; Audio.play('water_splash');
          var c=Util.$('[data-count]',host); if(c) c.textContent=m.count;

    evaluate:function(task,inst,tk){
      var m=inst.misc[tk]||{count:0}, ok=(m.count===Util.safeNum(task.total,0));
      return { done:ok, right:ok?1:0, total:1 };
    },
    solve:function(task,inst,tk){ (inst.misc[tk]||(inst.misc[tk]={})).count=Util.safeNum(task.total,0); },
    reset:function(task,inst,tk){ inst.misc[tk]={count:0}; }
  };

  var registry={ dragDrop:dragDrop, tapRhythm:tapRhythm, slider:slider, rotate:rotate, charge:charge,
                 connect:connect, trace:trace, magnifier:magnifier, counter:counter };
  function byName(n){ return registry[n]||dragDrop; }
  return { registry:registry, byName:byName, names:Object.keys(registry) };
})();

/* ============================================================
 * M12b · Games（GameEngine：统一接口 + 结算幂等；结算只由显式动作触发）
 * ============================================================ */
var Games=(function(){
  var cur=null;
  function def(id){ return Data.gameById[id]; }
  function steps(id){ return Data.gameSteps[id]||{tasks:[]}; }
  function art(id){ var d=def(id); return d?Data.artifactById[d.artifactId]:null; }

  function teardown(){
    if(!cur) return;
    (cur.timers||[]).forEach(function(t){
      try{ clearInterval(t); }catch(e){}
      try{ clearTimeout(t); }catch(e){}
      if(Object.prototype.toString.call(t)==='[object Array]'){ t.forEach(function(x){ try{ clearTimeout(x); }catch(e){} }); }
    });
    cur.timers=[]; cur=null;
  }

  function shell(inst){
    var d=inst.def, a=art(inst.gameId);
    var b=Data.beasts[(Data.chapterById[d.chapter]||{}).beast]||Data.beasts.qinglong;
    return '<div class="card game-card" data-game="'+inst.gameId+'">'+
      '<div class="tag" style="background:'+b.accent+';color:'+b.main+'">二级体验 · '+Util.esc(d.title)+'</div>'+
      '<h3 style="color:'+b.main+';margin:6px 0">'+Util.esc(d.title)+'</h3>'+
      '<p class="muted">知识钥匙：'+Util.esc(d.bind||'')+'</p>'+
      (a?'<p class="note">文物：'+Util.esc(a.name)+'（'+Util.esc(a.era)+' · '+Util.esc(a.cat)+'）</p>':'')+
      '<div class="game-body" id="gameBody"></div>'+
      '<div class="game-foot" id="gameFoot"></div></div>';
  }
  function bodyHtml(inst){
    return steps(inst.gameId).tasks.map(function(task,ti){
      var tk='t'+ti, prim=Primitives.byName(task.p);
      return '<section class="game-task" data-task="'+tk+'" data-prim="'+Util.esc(task.p)+'">'+
        '<div class="gt-prompt"><b>'+(ti+1)+'.</b> '+Util.esc(task.prompt||'')+'</div>'+
        '<div class="gt-body">'+prim.render(task,inst,tk)+'</div></section>';
    }).join('');
  }
  function footHtml(inst){
    if(inst.done) return '<div class="energy-pill">'+Assets.icon('u-check',null,'完成')+' 已完成 · 准确度 '+Util.pct(inst.accuracy,1)+'%</div>';
    return '<div class="game-actions row">'+
      '<button class="btn jade" type="button" data-check>做好了 · 对一对</button>'+
      '<button class="btn ghost" type="button" data-hint>给我点提示（'+inst.hintLevel+'/3）</button>'+
      '<button class="btn ghost" type="button" data-retry>再试一次</button></div>'+
      '<div class="game-fb" data-fb role="status"></div>';
  }
  function doneHtml(inst,praise){
    var ex=Data.formatExplain(inst.def);
    return '<div class="game-done">'+
      '<div class="energy-pill">'+Assets.icon('u-check',null,'完成')+' 完成！准确度 '+Util.pct(inst.accuracy,1)+'%</div>'+
      (praise||'')+
      '<div class="section-title">讲解</div>'+
      '<div class="explain-box"><p class="muted">'+Util.esc(ex.intro)+'</p><ul class="facts-list">'+
      ex.lines.map(function(l){ return '<li>'+Util.esc(l)+'</li>'; }).join('')+'</ul></div></div>';
  }
  function ctxOf(inst){ return { repaint:function(tk){ repaint(inst,tk); } }; }
  function repaint(inst,tk){
    var sec=Util.$('[data-task="'+tk+'"] .gt-body',inst.host); if(!sec) return;
    var ti=parseInt(tk.slice(1),10), task=steps(inst.gameId).tasks[ti];
    sec.innerHTML=Primitives.byName(task.p).render(task,inst,tk);
  }
  function repaintAll(inst){
    steps(inst.gameId).tasks.forEach(function(t,ti){ repaint(inst,'t'+ti); });
  }
  function bindTasks(inst){
    steps(inst.gameId).tasks.forEach(function(task,ti){
      var tk='t'+ti, sec=Util.$('[data-task="'+tk+'"] .gt-body',inst.host);
      if(sec) Primitives.byName(task.p).bind(sec,task,inst,tk,ctxOf(inst));
    });
  }
  function bindFoot(inst){
    var ck=Util.$('[data-check]',inst.host); if(ck) ck.onclick=function(){ check(inst); };
    var hn=Util.$('[data-hint]',inst.host); if(hn) hn.onclick=function(){ hint(inst); };
    var rt=Util.$('[data-retry]',inst.host); if(rt) rt.onclick=function(){ retry(inst); };
  }
  function writeProgress(inst){
    var st=Store.state, g=st.games[inst.gameId]||(st.games[inst.gameId]={});
    g.attempts=inst.attempt; g.hintCount=inst.hintCount||0; g.maxHintLevel=inst.maxHintLevel||0;
    g.accuracy=inst.accuracy; g.timeSec=Math.round((Date.now()-inst.startedAt)/1000);
    g.firstTry=(inst.attempt===1);
    Store.saveState();
  }
  function check(inst){
    if(inst.done) return;
    Audio.play('ui_tap'); inst.attempt++;
    var right=0, total=0;
    steps(inst.gameId).tasks.forEach(function(task,ti){
      var r=Primitives.byName(task.p).evaluate(task,inst,'t'+ti);
      right+=r.right; total+=r.total;
    });
    inst.accuracy=total?right/total:0;
    writeProgress(inst);
    if(total>0&&right===total){ succeed(inst); }
    else {
      var fb=Util.$('[data-fb]',inst.host);
      if(fb) fb.innerHTML='<span class="tag gold">还差一点点！</span> 你已经做对 '+right+'/'+total+' 步，再检查一下没对的地方吧——不着急，可以「再试一次」。';
      Audio.play('ui_gentle');
    }
  }
  function precisePraise(inst){
    if(inst.gameId!=='xl-rhythm') return '';
    var m=inst.misc['t0']||{}, dev=Util.safeNum(m.maxDev,Infinity);
    if(!isFinite(dev)||dev>Data.timing.rhythm.bonus) return '';
    var ms=Math.round(dev), g=Store.state.games['xl-rhythm']||(Store.state.games['xl-rhythm']={});
    if(!g.starsLogged){ g.stars=(g.stars||[]); g.stars.push(ms); g.starsLogged=true; }
    return '<div class="energy-pill star-pill">'+Assets.icon('u-star',null,'精准之星')+' 这次差 <b>'+ms+'</b> 毫秒，手比钟表还准！</div>';
  }
  function succeed(inst){
    var d=inst.def;
    var gain=Math.round(Util.safeNum(d.reward&&d.reward.energy,0)*inst.accuracy);
    var isNew=Store.settleOnce('game:'+inst.gameId,function(){
      var st=Store.state, g=st.games[inst.gameId]||(st.games[inst.gameId]={});
      g.done=true; g.settled=true; g.accuracy=inst.accuracy; g.attempts=inst.attempt;
      g.hintCount=inst.hintCount||0; g.maxHintLevel=inst.maxHintLevel||0; g.timeSec=Math.round((Date.now()-inst.startedAt)/1000);
      var rec=st.progress.artifacts[d.artifactId]||(st.progress.artifacts[d.artifactId]={observed:false,detailsOpened:{},gameDone:false,gameSettled:false,accuracy:0});
      rec.gameDone=true; rec.gameSettled=true; rec.accuracy=inst.accuracy;
      Store.logEvent({ type:'game_settle', chapter:d.chapter, artifactId:d.artifactId, dim:d.reward&&d.reward.dim, literacy:'问题解决', meta:{ gameId:inst.gameId, accuracy:inst.accuracy } });
    });
    if(isNew) addEnergy(gain,'二级体验 · '+d.title);
    var praise=precisePraise(inst);
    inst.done=true; inst.phase='done';
    var body=Util.$('#gameBody',inst.host); if(body) body.innerHTML=doneHtml(inst,praise);
    var foot=Util.$('#gameFoot',inst.host); if(foot) foot.innerHTML=footHtml(inst);
    renderHUD();
    Toast(isNew?('完成！+'+gain+' 能量'):'这一关之前就完成啦');
  }
  function hint(inst){
    inst.hintCount=(inst.hintCount||0)+1;
    if(inst.hintLevel<3) inst.hintLevel++;
    inst.maxHintLevel=Math.max(inst.maxHintLevel||0, inst.hintLevel);
    if(inst.hintLevel>=3){
      steps(inst.gameId).tasks.forEach(function(task,ti){ Primitives.byName(task.p).solve(task,inst,'t'+ti); });
      repaintAll(inst);
    }
    var hints=inst.def.hints||[], txt=hints[Math.min(inst.hintLevel-1,hints.length-1)]||'';
    var hn=Util.$('[data-hint]',inst.host); if(hn) hn.textContent='给我点提示（'+inst.hintLevel+'/3）';
    var fb=Util.$('[data-fb]',inst.host); if(fb) fb.innerHTML='<span class="tag">提示 '+inst.hintLevel+'：</span> '+Util.esc(txt);
    Audio.play('ui_gentle'); writeProgress(inst);
  }
  function retry(inst){
    steps(inst.gameId).tasks.forEach(function(task,ti){ Primitives.byName(task.p).reset(task,inst,'t'+ti); });
    inst.done=false; inst.phase='playing'; inst.accuracy=0;
    repaintAll(inst);
    var fb=Util.$('[data-fb]',inst.host); if(fb) fb.innerHTML='<span class="tag">重新开始</span> 这次慢慢来，先读一读提示。';
    Audio.play('ui_tap');
  }
  function mount(gameId,host){
    teardown();
    var d=def(gameId); if(!d||!host) return null;
    var inst={ gameId:gameId, def:d, host:host, ans:{}, misc:{}, timers:[],
               attempt:1, hintLevel:0, hintCount:0, maxHintLevel:0, accuracy:0, phase:'playing', done:false,
               startedAt:Date.now() };
    cur=inst;
    host.innerHTML=shell(inst);
    var saved=Store.state.games[gameId];
    var body=Util.$('#gameBody',host);
    if(saved&&saved.done){
      inst.done=true; inst.phase='done'; inst.accuracy=Util.safeNum(saved.accuracy,1);
      if(body) body.innerHTML=doneHtml(inst,'');
      var foot0=Util.$('#gameFoot',host); if(foot0) foot0.innerHTML=footHtml(inst);
    } else {
      if(body) body.innerHTML=bodyHtml(inst);
      var foot=Util.$('#gameFoot',host); if(foot) foot.innerHTML=footHtml(inst);
      bindTasks(inst); bindFoot(inst);
    }
    return inst;
  }
  function state(){
    return cur?{ gameId:cur.gameId, phase:cur.phase, done:cur.done, accuracy:cur.accuracy,
                 hintLevel:cur.hintLevel, attempt:cur.attempt } : null;
  }
  function visiblePrimitives(){ return Primitives.names; }
  return { mount:mount, teardown:teardown, state:state, visiblePrimitives:visiblePrimitives };
})();

/* ============================================================
 * M13 · Express（中期多形式表达：一个屏壳 + 4 份配置；产出回写灵宠）
 * ============================================================ */
var Express=(function(){
  var ID='screen-express';
  function cfgOf(mode){ var l=Data.express.filter(function(x){ return x.mode===mode; }); return l[0]||Data.express[0]; }
  function beasts(){ return Data.beasts[Store.state.pet.beast||'qinglong']||Data.beasts.qinglong; }

  function build(params){
    var mode=(params&&params.mode)||'puzzle', c=cfgOf(mode);
    var tabs=Data.express.map(function(x){
      return '<button class="btn sm '+(x.mode===mode?'jade':'ghost')+'" type="button" data-emode="'+x.mode+'">'+Util.esc(x.title.split(' · ')[0])+'</button>';
    }).join('');
    return '<div class="screen-inner">'+
      '<div class="section-title">表达工坊 · '+Util.esc(c.title)+'</div>'+
      '<div class="row" data-etabs>'+tabs+'</div>'+
      '<p class="muted" style="margin-top:8px">'+Util.esc(c.hint)+'（完成后会改变你的灵宠外观）</p>'+
      '<div class="card" id="expressHost"></div>'+
      '<div class="center" style="margin-top:10px"><button class="btn ghost sm" id="expBack" type="button">返回指挥官舱</button></div></div>';
  }
  function mount(root,params){
    root=root||Util.$('#'+ID); if(!root) return;
    var mode=(params&&params.mode)||'puzzle';
    var tabs=Util.$('[data-etabs]',root);
    if(tabs) tabs.onclick=function(e){ var t=e.target.closest('[data-emode]'); if(!t) return; Audio.play('ui_tap'); Router.replace(ID,{mode:t.getAttribute('data-emode')}); };
    var back=Util.$('#expBack',root); if(back) back.onclick=function(){ Audio.play('ui_tap'); Router.push('screen-hub'); };
    var host=Util.$('#expressHost',root); if(!host) return;
    if(mode==='puzzle') mountPuzzle(host);
    else if(mode==='draw') mountDraw(host);
    else if(mode==='design') mountDesign(host);
    else mountDance(host);
  }

  function finish(host,key,label,motif,gain){
    var st=Store.state, cr=st.creations;
    cr[key]={ done:true, ts:Date.now() };
    cr.completedCount=Util.safeNum(cr.completedCount,0)+1;
    if(motif){ st.pet.custom.motif=motif; }
    Store.settleOnce('express:'+key,function(){ Store.logEvent({ type:'express', kind:key, literacy:'审美情趣' }); });
    Store.saveState(true);
    Pet.applyCustom(); if(Pet.state().mounted) Pet.render();
    addEnergy(gain,'表达 · '+label);
    var fb=Util.$('[data-fb]',host);
    if(fb) fb.innerHTML='<div class="energy-pill">'+Assets.icon('u-check',null,'完成')+' '+Util.esc(label)+'完成！灵宠换上了新的纹样，回指挥官舱看看吧。</div>';
    Toast(label+'完成，灵宠变样啦');
  }
  /* ---- 拼图（T08：真拼块 · 不规则碎片 · 拖拽/旋转/吸附/拼缝闭合） ----
     把文物本体（#a-jt）按 3×2「带凹凸榫」的碎片裁开：碎片共用同一个 <use>，靠 clipPath 分割，
     所以拼起来天然严丝合缝。坐标一律在文物的 200×200 画布里算；落位判定用「格子矩形」
     （3×2 格子互不重叠 → 判定无歧义）。旋转不设失败惩罚：同块连续 2 次没转正就自动帮它转正。 */
  var PZ_C=3, PZ_R=2, PZ_X=6, PZ_Y=18, PZ_W=188, PZ_H=156;   /* 兜底值；真正挂载时会按文物包围盒校正 */
  var PZ_CW=PZ_W/PZ_C, PZ_CH=PZ_H/PZ_R;
  var PZ_K=Math.min(PZ_CW,PZ_CH)*0.30;
  var PZ_PAD=PZ_K*1.5+2;
  var PZ_ART='jt';
  function pzRecalc(){ PZ_CW=PZ_W/PZ_C; PZ_CH=PZ_H/PZ_R; PZ_K=Math.min(PZ_CW,PZ_CH)*0.30; PZ_PAD=PZ_K*1.5+2; }
  /* 量出文物本体真正画到哪儿（0..200 画布内的包围盒）。网格若不贴上去，就会比画面大一圈，
     四周留出大片空白，拼完整幅仍像「中间一小块」——拼图应是「把文物本体切开的 6 块」。 */
  function pzMeasureArt(){
    try{
      var NS='http://www.w3.org/2000/svg';
      var s=document.createElementNS(NS,'svg');
      s.setAttribute('viewBox','0 0 200 200');
      s.style.cssText='position:absolute;left:-9999px;top:0;width:200px;height:200px';
      s.innerHTML='<use href="#a-'+PZ_ART+'" x="0" y="0" width="200" height="200"/>';
      document.body.appendChild(s);
      var b=s.firstChild.getBBox();
      document.body.removeChild(s);
      if(b&&b.width>20&&b.height>20) return { x:b.x, y:b.y, w:b.width, h:b.height };
    }catch(e){}
    return null;
  }
  function pzR(v){ return Math.round(v*100)/100; }
  function pzV(r,c){ return ((r+c)%2===0)?1:-1; }   /* 竖缝：左侧碎片的右边缘 凸(+1)/凹(-1) */
  function pzH(r,c){ return ((r+c)%2===0)?-1:1; }   /* 横缝：上方碎片的下边缘 凸(+1)/凹(-1) */
  function pzKnob(x1,y1,x2,y2,tab){
    if(!tab) return 'L '+pzR(x2)+' '+pzR(y2)+' ';
    var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), ux=dx/L, uy=dy/L;
    var nx=uy, ny=-ux;                              /* 顺时针路径的外法线 */
    var tw=L*0.17, th=PZ_K*tab;
    var mx=(x1+x2)/2, my=(y1+y2)/2;
    var ax=mx-ux*tw, ay=my-uy*tw, bx=mx+ux*tw, by=my+uy*tw;
    /* 收尾必须补一段 L 到边终点 (x2,y2)：榫头出口在角点前 tw 处，
       不补的话下一条边会直接从出口斜拉到榫头入口 —— 切掉整个角，碎块也就咬不上了。 */
    return 'L '+pzR(ax)+' '+pzR(ay)+' C '+
      pzR(ax+nx*th*1.4)+' '+pzR(ay+ny*th*1.4)+' '+
      pzR(bx+nx*th*1.4)+' '+pzR(by+ny*th*1.4)+' '+
      pzR(bx)+' '+pzR(by)+' L '+pzR(x2)+' '+pzR(y2)+' ';
  }
  function pzPathD(i){
    var c=i%PZ_C, r=Math.floor(i/PZ_C);
    var x=PZ_X+c*PZ_CW, y=PZ_Y+r*PZ_CH, x2=x+PZ_CW, y2=y+PZ_CH;
    var top=(r===0)?0:-pzH(r-1,c), bottom=(r===PZ_R-1)?0:pzH(r,c);
    var left=(c===0)?0:-pzV(r,c-1), right=(c===PZ_C-1)?0:pzV(r,c);
    return 'M '+pzR(x)+' '+pzR(y)+' '+
      pzKnob(x,y,x2,y,top)+pzKnob(x2,y,x2,y2,right)+
      pzKnob(x2,y2,x,y2,bottom)+pzKnob(x,y2,x,y,left)+'Z';
  }
  function pzCellVB(i){
    var c=i%PZ_C, r=Math.floor(i/PZ_C);
    return { x:PZ_X+c*PZ_CW-PZ_PAD, y:PZ_Y+r*PZ_CH-PZ_PAD, w:PZ_CW+2*PZ_PAD, h:PZ_CH+2*PZ_PAD };
  }
  function pzUse(){ return '<use href="#a-'+PZ_ART+'" x="0" y="0" width="200" height="200"/>'; }
  function pzPieceSVG(i,prefix){
    var vb=pzCellVB(i), d=pzPathD(i);
    return '<svg viewBox="'+pzR(vb.x)+' '+pzR(vb.y)+' '+pzR(vb.w)+' '+pzR(vb.h)+'" role="img" aria-hidden="true">'+
      '<defs><clipPath id="'+prefix+'-'+i+'"><path d="'+d+'"/></clipPath></defs>'+
      '<g clip-path="url(#'+prefix+'-'+i+')">'+pzUse()+'</g>'+
      '<path class="pz-edge" d="'+d+'"/></svg>';
  }
  function pzDeg(rot){ return ((((rot%4)+4)%4)*90); }
  function pzPieceHTML(i,rot){
    var deg=pzDeg(rot);
    return '<button class="pz-piece" type="button" data-pz="'+i+'" aria-label="拼块 '+(i+1)+'：按一下旋转 90 度，再拖到右边拼图板">'+
      '<span class="pz-rot-wrap"'+(deg?(' style="transform:rotate('+deg+'deg)"'):'')+'>'+pzPieceSVG(i,'pzt')+'</span>'+
      (deg?('<span class="pz-rot">↻ '+deg+'°</span>'):'')+'</button>';
  }
  function pzBoardHTML(placed){
    var defs='<defs>';
    for(var i=0;i<6;i++){ defs+='<clipPath id="pzb-'+i+'"><path d="'+pzPathD(i)+'"/></clipPath>'; }
    defs+='</defs>';
    var out='';
    for(var s=0;s<6;s++){ out+='<path class="pz-slotp'+(placed[s]?' done':'')+'" data-pz-slot="'+s+'" d="'+pzPathD(s)+'"/>'; }
    for(var p=0;p<6;p++){
      if(!placed[p]) continue;
      out+='<g class="pz-on"><g clip-path="url(#pzb-'+p+')">'+pzUse()+'</g>'+
           '<path class="pz-seam" d="'+pzPathD(p)+'"/></g>';
    }
    var m=PZ_PAD;
    return '<svg class="pz-board" viewBox="'+pzR(PZ_X-m)+' '+pzR(PZ_Y-m)+' '+pzR(PZ_W+2*m)+' '+pzR(PZ_H+2*m)+'" role="img" aria-label="拼图板：把碎片拖到虚线格子里复原文物">'+defs+out+'</svg>';
  }
  function mountPuzzle(host){
    if(!host) return;
    try{ Assets.injectSymbols('art-ch1'); }catch(e){}   /* 确保 #a-jt 已在 sprite 里 */
    var pzBox=pzMeasureArt();
    if(pzBox){ PZ_X=pzBox.x; PZ_Y=pzBox.y; PZ_W=pzBox.w; PZ_H=pzBox.h; pzRecalc(); }   /* 网格贴合文物本体 */
    var placed=[false,false,false,false,false,false];
    var rots=[0,1,2,3,4,5].map(function(){ return Util.randInt(1,3); });
    var fails=[0,0,0,0,0,0];
    var flySeq=0, done=false, dragEndAt=0;

    function hint(msg,warn){
      var el=Util.$('[data-pz-hint]',host); if(!el) return;
      el.textContent=msg; el.classList.toggle('warn',!!warn);
    }
    function count(){ return placed.filter(Boolean).length; }
    function redrawTray(){
      var t=Util.$('[data-pz-tray]',host); if(!t) return;
      var list=[0,1,2,3,4,5].filter(function(i){ return !placed[i]; });
      t.innerHTML=list.length?list.map(function(i){ return pzPieceHTML(i,rots[i]); }).join('')
        :'<span class="pz-empty">碎片都拼上去啦。</span>';
    }
    function redrawBoard(){
      var b=Util.$('[data-pz-board]',host); if(b) b.innerHTML=pzBoardHTML(placed);
    }
    function pulse(i,cls){
      var p=Util.$('[data-pz="'+i+'"]',host); if(!p) return;
      p.classList.remove(cls); void p.offsetWidth; p.classList.add(cls);
      setTimeout(function(){ p.classList.remove(cls); }, cls==='zing'?360:1900);
    }
    function boardSVG(){ return Util.$('.pz-board',host); }
    /* 格子矩形（屏幕坐标）——3×2 互不重叠，判定无歧义 */
    function cellRect(i){
      var svg=boardSVG(); if(!svg) return null;
      var m=svg.getScreenCTM(); if(!m) return null;
      var c=i%PZ_C, r=Math.floor(i/PZ_C);
      var x1=PZ_X+c*PZ_CW, y1=PZ_Y+r*PZ_CH, x2=x1+PZ_CW, y2=y1+PZ_CH;
      var ax=m.a*x1+m.c*y1+m.e, ay=m.b*x1+m.d*y1+m.f;
      var bx=m.a*x2+m.c*y2+m.e, by=m.b*x2+m.d*y2+m.f;
      return { left:Math.min(ax,bx), right:Math.max(ax,bx), top:Math.min(ay,by), bottom:Math.max(ay,by) };
    }
    function slotAt(x,y){
      for(var i=0;i<6;i++){ var r=cellRect(i); if(r&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return i; }
      return -1;
    }
    function paintHot(hit){
      var L=Util.$$('[data-pz-slot]',host);
      for(var i=0;i<L.length;i++){ L[i].classList.toggle('hot', +L[i].getAttribute('data-pz-slot')===hit); }
    }
    function place(i){
      placed[i]=true;
      Audio.play('ui_correct');
      redrawTray(); redrawBoard();
      if(count()>=6){ hint('拼好啦！拼缝一条条合上了。'); complete(); return; }
      hint('拼上啦！还差 '+(6-count())+' 块。');
    }
    function complete(){
      done=true;
      var wrap=Util.$('[data-pz-board]',host);
      if(wrap){
        var fx=document.createElement('div'); fx.className='pz-shine-fx'; fx.setAttribute('aria-hidden','true');
        wrap.appendChild(fx);
      }
      setTimeout(function(){ finish(host,'puzzle','拼图 · 文物复原','puzzle',25); }, 950);
    }
    function drop(i,hit){
      if(hit===i){
        if(pzDeg(rots[i])!==0){
          fails[i]++;
          pulse(i,'zing');
          Audio.play('ui_gentle');
          if(fails[i]>=2){
            rots[i]=0;
            var w=Util.$('[data-pz="'+i+'"] .pz-rot-wrap',host); if(w) w.style.transform='rotate(0deg)';
            var b=Util.$('[data-pz="'+i+'"] .pz-rot',host); if(b) b.remove();
            hint('我已经帮你把它转正啦，再拖一次就能放进去。',true);
          } else {
            hint('先按一下这块碎片，把它转正（↻ 90°），再拖进来～',true);
          }
          return;
        }
        place(i);
        return;
      }
      var sp=Util.$('[data-pz-slot="'+hit+'"]',host);
      if(sp){ sp.classList.add('wrong'); setTimeout(function(){ sp.classList.remove('wrong'); },430); }
      pulse(i,'zing');
      Audio.play('ui_gentle');
      hint(hit<0?'把碎片拖到右边拼图板的虚线格子里哦。':'这块不在这里——看看它的形状，再找个位置试试。',true);
    }

    function render(){
      var list=[0,1,2,3,4,5].filter(function(i){ return !placed[i]; });
      host.innerHTML=
        '<p class="muted">把 6 块碎片拖到右边的拼图板上，复原江豚形壶。碎片歪了？按一下它就能转正。</p>'+
        '<div class="pz-wrap">'+
          '<div class="pz-tray" data-pz-tray>'+
            (list.length?list.map(function(i){ return pzPieceHTML(i,rots[i]); }).join(''):'<span class="pz-empty">碎片都拼上去啦。</span>')+
          '</div>'+
          '<div class="pz-slotwrap" data-pz-board>'+pzBoardHTML(placed)+'</div>'+
        '</div>'+
        '<p class="pz-hint" data-pz-hint>已拼好 '+count()+' / 6</p>'+
        '<div class="game-fb" data-fb></div>';
    }

    /* 事件：用属性赋值（幂等），切换 tab 重新 mount 不会叠加监听 */
    host.onpointerdown=function(e){
      var p=e.target.closest&&e.target.closest('[data-pz]'); if(!p||done) return;
      var i=+p.getAttribute('data-pz'); if(placed[i]) return;
      e.preventDefault();
      var sx=e.clientX, sy=e.clientY, moved=false, fly=null;
      function mv(ev){
        if(!moved&&(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy))>7){
          moved=true;
          fly=document.createElement('div'); fly.className='pz-fly';
          fly.setAttribute('aria-hidden','true');
          fly.innerHTML='<div style="transform:rotate('+pzDeg(rots[i])+'deg)">'+pzPieceSVG(i,'pzf'+(++flySeq))+'</div>';
          fly.style.left=ev.clientX+'px'; fly.style.top=ev.clientY+'px';
          document.body.appendChild(fly);
          p.classList.add('picked');
        }
        if(!moved) return;
        fly.style.left=ev.clientX+'px'; fly.style.top=ev.clientY+'px';
        fly.querySelector('div').style.transform='rotate('+pzDeg(rots[i])+'deg)';   /* 拖拽中同步当前角度 */
        paintHot(slotAt(ev.clientX,ev.clientY));
      }
      function up(ev){
        document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
        if(fly){ try{ fly.remove(); }catch(_){} }
        try{ p.classList.remove('picked'); }catch(_){}
        paintHot(-1);
        if(!moved) return;                 /* 没移动 → 交给 click 处理旋转 */
        dragEndAt=Date.now();              /* 拖完的一小段时间内，忽略浏览器补发的 click */
        drop(i,slotAt(ev.clientX,ev.clientY));
      }
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    };
    host.onclick=function(e){
      var p=e.target.closest&&e.target.closest('[data-pz]'); if(!p||done) return;
      if(Date.now()-dragEndAt<420) return;    /* 刚拖完的那一下不算点击（时间窗自愈，不会被上一次拖拽永久卡住） */
      var i=+p.getAttribute('data-pz'); if(placed[i]) return;
      rots[i]=(rots[i]+1)%4;
      var w=Util.$('[data-pz="'+i+'"] .pz-rot-wrap',host);
      if(w) w.style.transform='rotate('+pzDeg(rots[i])+'deg)';
      var p0=Util.$('[data-pz="'+i+'"]',host);
      if(p0){
        var badge=Util.$('.pz-rot',p0);
        if(pzDeg(rots[i])===0){ if(badge) badge.remove(); }
        else if(badge) badge.textContent='↻ '+pzDeg(rots[i])+'°';
        else { var sp=document.createElement('span'); sp.className='pz-rot'; sp.textContent='↻ '+pzDeg(rots[i])+'°'; p0.appendChild(sp); }
      }
      Audio.play('rotate_click');
      if(pzDeg(rots[i])===0) hint('转正啦！现在把它拖到右边对应的格子里。');
      else hint('再按一下可以继续转；转到正了再拖进去。');
    };

    render();
    function onResize(){ paintHot(-1); }
    try{ window.addEventListener('resize',onResize); }catch(e){}

  /* ---- 绘画（画布 → 320px JPEG，最多 3 幅；平均色回写灵宠配色） ---- */
  function avgColor(ctx,w,h){
    var d;
    try{ d=ctx.getImageData(0,0,w,h).data; }catch(e){ return null; }
    var r=0,g=0,b=0,n=0;
    for(var i=0;i<d.length;i+=4){
      var R=d[i],G=d[i+1],B=d[i+2];
      if(R>238&&G>238&&B>238) continue;      /* 跳过近白底 */
      r+=R; g+=G; b+=B; n++;
    }
    if(n<200) return null;
    function hx(v){ v=Math.round(v/n); v=Math.max(0,Math.min(255,v)); return ('0'+v.toString(16)).slice(-2); }
    function lighten(v,f){ return Math.max(0,Math.min(255,Math.round(v/n+(255-v/n)*f))); }
    function hxl(v,f){ v=lighten(v,f); return ('0'+v.toString(16)).slice(-2); }
    return { main:'#'+hx(r)+hx(g)+hx(b), accent:'#'+hxl(r,0.72)+hxl(g,0.72)+hxl(b,0.72) };
  }
  function mountDraw(host){
    host.innerHTML='<p class="muted">在下面的画布上，画出「我心中的运河一天」。</p>'+

      '<div class="row" style="margin-top:8px"><label class="p-swatch">画笔<input type="color" id="drawColor" value="#2E86C1" aria-label="画笔颜色"></label>'+
      '<button class="btn ghost sm" type="button" data-clear>清空</button>'+
      '<button class="btn jade sm" type="button" data-save>画好了 · 变成灵宠新配色</button></div>'+
      '<div class="game-fb" data-fb></div>';
    var cv=Util.$('#drawCanvas',host), ctx=cv.getContext('2d');
    ctx.fillStyle='#FBFDFE'; ctx.fillRect(0,0,cv.width,cv.height);
    var drawing=false;
    function pos(e){ var r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) }; }
    cv.addEventListener('pointerdown',function(e){ drawing=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      ctx.lineTo(p.x+0.01,p.y); ctx.strokeStyle=Util.$('#drawColor',host).value||'#2E86C1'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.stroke(); });
    cv.addEventListener('pointermove',function(e){ if(!drawing) return; var p=pos(e); ctx.strokeStyle=Util.$('#drawColor',host).value||'#2E86C1'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineTo(p.x,p.y); ctx.stroke(); });
    cv.addEventListener('pointerup',function(){ drawing=false; });
    cv.addEventListener('pointerleave',function(){ drawing=false; });
    var clear=Util.$('[data-clear]',host); if(clear) clear.onclick=function(){ ctx.fillStyle='#FBFDFE'; ctx.fillRect(0,0,cv.width,cv.height); };
    var save=Util.$('[data-save]',host);
    if(save) save.onclick=function(){
      var url=''; try{ url=cv.toDataURL('image/jpeg',0.7); }catch(e){}

      addEnergy(30,'绘画 · 我心中的运河一天');
      var fb=Util.$('[data-fb]',host);
      if(fb) fb.innerHTML='<div class="energy-pill">'+Assets.icon('u-check',null,'已保存')+' 画作约 '+Math.round(bytes/1024)+' KB（保留最近 '+cr.draws.length+' 幅）。'+(avg?'画面平均色成了灵宠新配色。':'再多画几笔，颜色会更明显。')+'</div>';

  /* ---- 舞蹈（号子节拍；判定窗读 Data.dance.timingMs，失败无惩罚） ---- */
  function mountDance(host){
    var d=Data.dance, beats=d.moves.map(function(_,i){ return i*d.beatMs; });
    var taps=[], t0=0, started=false, sched=[];
    host.innerHTML='<p class="muted">'+Util.esc(d.guide)+'</p>'+
      '<div class="p-beats" data-beats>'+d.moves.map(function(mv){ return '<span class="p-beat">'+Util.esc(mv)+'</span>'; }).join('')+'</div>'+
      '<div class="row" style="margin-top:10px"><button class="btn jade" type="button" data-tap>跟着号子，踏一步</button>'+
      '<button class="btn ghost" type="button" data-guide2>先跟我学一遍</button><span class="muted" data-tc>已踏 0 步</span></div>'+
      '<div class="game-fb" data-fb></div>';
    function pulse(i){ var bs=Util.$$('.p-beat',host); if(bs[i]){ bs[i].classList.remove('pulse'); void bs[i].offsetWidth; bs[i].classList.add('pulse'); } }
    var g2=Util.$('[data-guide2]',host);
    if(g2) g2.onclick=function(){ Audio.resume(); sched.forEach(function(id){ clearTimeout(id); }); sched=[];
      beats.forEach(function(ms,i){ sched.push(setTimeout(function(){ pulse(i); Audio.play('drum_beat'); }, ms)); }); };
    var tap=Util.$('[data-tap]',host);
    if(tap) tap.onclick=function(){
      Audio.resume(); if(!started){ started=true; t0=performance.now(); }
      taps.push(performance.now()-t0); Audio.play('drum_beat');
      pulse(Math.min(taps.length-1,beats.length-1));
      var tc=Util.$('[data-tc]',host); if(tc) tc.textContent='已踏 '+taps.length+' 步';
      if(taps.length>=beats.length){ evalDance(); }
    };
    function evalDance(){
      var win=d.timingMs.pass, devs=taps.slice(0,beats.length).map(function(t){ var best=Infinity; beats.forEach(function(b){ best=Math.min(best,Math.abs(t-b)); }); return best; });
      var hits=devs.filter(function(x){ return x<=win; }).length;
      var acc=beats.length?hits/beats.length:0;
      if(hits>=beats.length){
        var st=Store.state; st.creations.dance={ done:true, moves:d.moves.slice(), bars:1, ts:Date.now() };
        st.pet.custom.motif='note';
        st.creations.completedCount=Util.safeNum(st.creations.completedCount,0)+1;
        Store.settleOnce('express:dance',function(){ Store.logEvent({ type:'express', kind:'dance', literacy:'劳动意识' }); });
        Store.saveState(true);
        Pet.applyCustom(); if(Pet.state().mounted) Pet.render();
        addEnergy(30,'舞蹈 · 运河号子舞');
        var fb=Util.$('[data-fb]',host);
        if(fb) fb.innerHTML='<div class="energy-pill">'+Assets.icon('u-check',null,'完成')+' 你和上了号子的节拍（命中 '+hits+'/'+beats.length+'）！灵宠也学会了这段舞。</div>';
        Toast('号子舞完成');
      } else {
        var fb2=Util.$('[data-fb]',host);
        if(fb2) fb2.innerHTML='<span class="tag gold">再来一次</span> 你按对了 '+hits+'/'+beats.length+' 拍——不着急，点「先跟我学一遍」再试试。';
        Audio.play('ui_gentle');
        taps=[]; started=false;
        var tc2=Util.$('[data-tc]',host); if(tc2) tc2.textContent='已踏 0 步';
      }
    }
  }
  return { build:build, mount:mount, ID:ID };
})();

  function gameDone(st,id){ return !!(st.games[id]&&st.games[id].done); }
  function countDetails(st){ var n=0; var m=st.progress.artifacts||{}; Object.keys(m).forEach(function(k){ var r=m[k]; if(r&&r.detailsOpened) n+=Object.keys(r.detailsOpened).length; }); return n; }
  function chatCount(st){ return ((st.agent&&st.agent.turns)||[]).filter(function(t){ return t.role==='kid'; }).length; }

    [0.25,0.5,0.75,1].forEach(function(f){ var p=[]; for(var i=0;i<n;i++){ var q=pt(i,R*f); p.push(q[0].toFixed(1)+','+q[1].toFixed(1)); } grid+='<polygon points="'+p.join(' ')+'" fill="none" stroke="#DCEBF2" stroke-width="1"/>'; });
    var axes=''; for(var i=0;i<n;i++){ var q=pt(i,R); axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#DCEBF2" stroke-width="1"/>'; }

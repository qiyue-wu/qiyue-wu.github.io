<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>大运河·漕运指挥官 2.0 | 扬州中国大运河博物馆</title>
<style>
/* ============================================================
   设计系统（亮色 · 中国水文化）— 2.0
   零外部依赖 / 无外链字体 / 令牌唯一来源
   ============================================================ */
:root{
  /* ---- 色板（沿用 1.0 并扩展） ---- */
  --bg:#F7FBFC; --bg-soft:#EAF4F8;
  --ink:#14313D; --ink-2:#4A6A78;
  --canal:#2E86C1; --canal-deep:#1B5E8A; --canal-light:#BEE3F0;
  --jade:#16A085; --gold:#C8963E; --vermilion:#C0392B; --warn:#D68910;
  /* ---- 四方神兽语义色（东木/南火/西金/北水） ---- */
  --beast-east:#2E8B57;  --beast-east-a:#DDEFF2;
  --beast-south:#C0392B; --beast-south-a:#F6D9A8;
  --beast-west:#6B7A85;  --beast-west-a:#F0F2F4;
  --beast-north:#2C3E50; --beast-north-a:#B9C7D6;
  --r:16px; --r-sm:12px; --r-pill:999px;
  --shadow:0 6px 24px rgba(20,49,61,.08);
  --shadow-lg:0 16px 50px rgba(20,49,61,.20);
  --maxw:1080px;
  /* ---- z-index 令牌（全站唯一来源，§8.1） ---- */
  --z-bg:0; --z-scene:10; --z-content:20; --z-pet:30; --z-rail:45;
  --z-hud:60; --z-scrim:100; --z-overlay:110; --z-pop:150;
  --z-ritual:180; --z-top:190; --z-print:200;
}
*{box-sizing:border-box}
html{font-size:16px}
html.large-font{font-size:19px}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    repeating-linear-gradient(135deg, rgba(46,134,193,.035) 0 2px, transparent 2px 22px),
    linear-gradient(180deg,#F7FBFC 0%,#EAF4F8 55%,#E2F1F6 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:1rem; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body[data-lock="1"]{overflow:hidden}
button{font-family:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3}
p{margin:0 0 8px}
:focus-visible{outline:3px solid var(--vermilion);outline-offset:2px;border-radius:6px}

/* ---------- 后台固定渐变层 ---------- */
#bgLayer{position:fixed;inset:0;z-index:var(--z-bg);pointer-events:none}

/* ============================================================
   舞台（路由屏挂载点）
   ============================================================ */
#stage{position:relative;z-index:var(--z-content);min-height:100vh;min-height:100dvh}
.screen{
  position:relative;width:100%;min-height:100vh;min-height:100dvh;
  padding:84px 16px 84px;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  animation:screenIn .42s cubic-bezier(.25,.9,.35,1) both;
}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen-inner{width:100%;max-width:var(--maxw);margin:0 auto}
.screen.hidden-screen{display:none}

/* ---------- 通用卡片/按钮/标签 ---------- */
.card{background:#fff;border:1px solid #DCEBF2;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.panel{background:rgba(255,255,255,.88);border:1px solid #DCEBF2;border-radius:var(--r);box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--canal);color:#fff;border:none;border-radius:var(--r-pill);
  padding:11px 20px;font-size:1rem;font-weight:600;cursor:pointer;min-height:44px;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;
  box-shadow:0 4px 14px rgba(46,134,193,.28);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(46,134,193,.36)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--canal-deep);border:1.5px solid var(--canal-light);box-shadow:none}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.jade{background:var(--jade);box-shadow:0 4px 14px rgba(22,160,133,.3)}
.btn.gold{background:var(--gold);box-shadow:0 4px 14px rgba(200,150,62,.3)}
.btn.verm{background:var(--vermilion);box-shadow:0 4px 14px rgba(192,57,43,.28)}
.btn.sm{padding:8px 14px;font-size:.875rem;min-height:40px}
.btn.block{width:100%}
.tag{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:.8125rem;font-weight:600;background:var(--canal-light);color:var(--canal-deep)}
.tag.gold{background:#F6E7C9;color:#8A6420}
.tag.jade{background:#CFF0E8;color:#0E7A66}
.tag.verm{background:#F7DAD5;color:#8E2A1E}
.muted{color:var(--ink-2)}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grow{flex:1 1 240px}
.section-title{font-size:1.25rem;font-weight:800;color:var(--canal-deep);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:8px;height:22px;border-radius:4px;background:linear-gradient(180deg,var(--canal),var(--jade))}

/* ============================================================
   顶部常驻 HUD（z-60）
   ============================================================ */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:var(--z-hud);
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid #DCEBF2;
  box-shadow:0 2px 12px rgba(20,49,61,.06);
}
.hud-left{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.commander-badge{width:42px;height:42px;flex:none}
.commander-meta{line-height:1.15}
.commander-meta .t1{font-size:.75rem;color:var(--ink-2)}
.commander-meta .t2{font-size:.9375rem;font-weight:700;color:var(--canal-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.hud-center{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.pet-mini{width:40px;height:40px;flex:none}
.energy-wrap{flex:1 1 auto;min-width:64px}
.energy-bar{height:12px;border-radius:var(--r-pill);background:#E3EFF5;overflow:hidden;border:1px solid #D3E6EF}
#energyFill{height:100%;width:0;border-radius:var(--r-pill);background:linear-gradient(90deg,#7FD3C0,var(--jade));transition:width .6s cubic-bezier(.3,1.4,.6,1)}
.energy-text{font-size:.75rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-right{display:flex;gap:12px;flex:0 0 auto;align-items:center}
.stat{text-align:center;line-height:1.1}
.stat b{display:block;font-size:.9375rem;color:var(--canal-deep)}
.stat small{font-size:.6875rem;color:var(--ink-2)}
.hud-btn{width:40px;height:40px;border:1.5px solid var(--canal-light);background:#fff;border-radius:12px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--canal-deep)}
.hud-btn:hover{background:var(--bg-soft)}
.hud-btn svg{width:22px;height:22px}
@media(max-width:560px){.hud-center .energy-text{display:none}.stat.seal-stat{display:none}}

/* ============================================================
   右侧章节导航 rail（z-45）
   ============================================================ */
.rail{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:var(--z-rail);display:flex;flex-direction:column;gap:8px}
.chapter-nav{
  display:flex;flex-direction:column;gap:4px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(6px);
  border:1px solid #DCEBF2;border-radius:14px;padding:8px 6px;box-shadow:var(--shadow);
}
.nav-item{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:6px;border-radius:9px;color:var(--ink-2);font-size:.75rem;transition:background .2s;min-height:32px}
.nav-item .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--canal-light);background:#fff;flex:none;transition:.25s}
.nav-item .nl{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s ease,opacity .3s;opacity:0}
.nav-item.active{background:var(--bg-soft);color:var(--canal-deep);font-weight:700}
.nav-item.active .dot{background:var(--vermilion);border-color:var(--vermilion);transform:scale(1.2)}
.nav-item:hover .nl,.nav-item:focus-visible .nl{max-width:130px;opacity:1}

/* ============================================================
   常驻灵宠层（z-30）
   ============================================================ */
#petLayer{position:fixed;inset:0;z-index:var(--z-pet);pointer-events:none;overflow:hidden}
.pet-btn{
  position:absolute;width:96px;height:96px;padding:0;border:none;background:none;cursor:pointer;
  pointer-events:auto;filter:drop-shadow(0 8px 14px rgba(20,49,61,.18));
  transition:transform .5s cubic-bezier(.3,1.5,.6,1),left .9s ease,top .9s ease,right .9s ease,bottom .9s ease;
  will-change:transform;
}
.pet-btn svg{width:100%;height:100%;display:block}
.pet-btn.perched{width:58px;height:58px;opacity:.92}
.pet-btn:focus-visible{outline:3px solid var(--vermilion);outline-offset:3px;border-radius:50%}
.pet-bubble{
  position:absolute;pointer-events:none;max-width:250px;background:#fff;border:1.5px solid var(--canal-light);
  border-radius:14px;padding:9px 12px;box-shadow:var(--shadow);font-size:.8125rem;color:var(--ink);
  opacity:0;transform:translateY(8px);transition:.28s;z-index:var(--z-pet);
}
.pet-bubble.show{opacity:1;transform:none;pointer-events:auto}
.pet-bubble .chat-cta{display:block;margin-top:6px}
/* 游动关键帧（只用 transform / opacity） */
@keyframes swimEast{0%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(0,-26px) rotate(3deg)}50%{transform:translate(0,0) rotate(-3deg)}75%{transform:translate(0,30px) rotate(3deg)}100%{transform:translate(0,0) rotate(-3deg)}}
@keyframes swimWest{0%{transform:translate(0,0) rotate(3deg)}30%{transform:translate(0,24px) rotate(-3deg)}60%{transform:translate(0,-22px) rotate(3deg)}100%{transform:translate(0,0) rotate(3deg)}}
@keyframes swimSouth{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-30px,-10px) rotate(-4deg)}50%{transform:translate(0,0) rotate(0)}75%{transform:translate(30px,-10px) rotate(4deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes swimNorth{0%{transform:translate(0,0) scale(1)}50%{transform:translate(0,10px) scale(.97)}100%{transform:translate(0,0) scale(1)}}
.pet-btn.swim-east{animation:swimEast 6s ease-in-out infinite}
.pet-btn.swim-west{animation:swimWest 6.4s ease-in-out infinite}
.pet-btn.swim-south{animation:swimSouth 6.8s ease-in-out infinite}
.pet-btn.swim-north{animation:swimNorth 5.6s ease-in-out infinite}
.pet-btn.react-roll{animation:roll .9s cubic-bezier(.3,1.4,.6,1) 1}
@keyframes roll{0%{transform:rotate(0) scale(1)}45%{transform:rotate(360deg) scale(1.06)}100%{transform:rotate(360deg) scale(1)}}
.pet-btn.celebrate{animation:celebratePop 1.6s cubic-bezier(.3,1.6,.6,1) 1}
@keyframes celebratePop{0%,100%{transform:scale(1)}30%{transform:scale(1.28)}60%{transform:scale(1.1)}}
.pet-btn.mirror svg{transform:scaleX(-1)}

/* ============================================================
   toast / 粒子（z-150）
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-pill);font-size:.875rem;
  z-index:var(--z-pop);opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center;
}
.toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
.pop-particle{position:fixed;pointer-events:none;z-index:var(--z-pop);font-size:20px;animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(1.5)}}

/* ============================================================
   弹层（scrim z-100 / overlay z-110）
   ============================================================ */
#scrim{position:fixed;inset:0;z-index:var(--z-scrim);background:rgba(20,49,61,.42);display:none;opacity:0;transition:opacity .25s}
#scrim.show{display:block;opacity:1}
.overlay{position:fixed;inset:0;z-index:var(--z-overlay);display:none;place-items:center;padding:16px}
.overlay.show{display:grid;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay-box{
  background:#fff;border:1px solid var(--canal-light);border-radius:18px;
  box-shadow:var(--shadow-lg);max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;
  animation:pop .34s cubic-bezier(.3,1.5,.6,1);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.overlay-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.overlay-head h3{color:var(--canal-deep);font-size:1.125rem}

/* ============================================================
   仪式层（z-180 / 按钮 z-190）
   ============================================================ */
.ritual{position:fixed;inset:0;z-index:var(--z-ritual);display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(247,251,252,.75),rgba(234,244,248,.95))}
.ritual.show{display:grid;animation:fadeIn .3s}
.ritual-box{background:#fff;border:2px solid var(--gold);border-radius:20px;padding:20px 26px;text-align:center;box-shadow:var(--shadow-lg);animation:pop .5s cubic-bezier(.3,1.6,.6,1);max-width:520px}
.ritual-box .ritual-foot{z-index:var(--z-top)}

/* ============================================================
   启动 / 任命 / Hub
   ============================================================ */
.boot-title{font-size:clamp(24px,5.5vw,40px);font-weight:900;color:var(--canal-deep);letter-spacing:1px}
.boot-sub{color:var(--ink-2);margin-top:6px}
.beast-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:720px){.beast-grid{grid-template-columns:repeat(2,1fr)}}
.beast-card{background:#fff;border:2px solid #DCEBF2;border-radius:var(--r);padding:12px 10px;cursor:pointer;text-align:center;transition:.2s;min-height:44px}
.beast-card:hover{transform:translateY(-3px);border-color:var(--canal)}
.beast-card.sel{box-shadow:0 0 0 3px rgba(192,57,43,.14)}
.beast-card .nm{font-weight:800;font-size:1rem;margin-top:6px;color:var(--canal-deep)}
.beast-card .meta{font-size:.75rem;color:var(--ink-2)}
.beast-card .persona{font-size:.75rem;color:var(--ink-2);margin-top:4px;min-height:2.6em}
.beast-card .bstage{width:100%;height:110px}
.form-row{margin:12px 0}
.form-row label{display:block;font-weight:700;margin-bottom:6px;font-size:.9375rem}
input[type=text]{width:100%;font-family:inherit;font-size:1rem;padding:11px 14px;border-radius:var(--r-sm);border:1.5px solid #CFE3EC;background:#fff;color:var(--ink);min-height:44px}
input[type=text]:focus{border-color:var(--canal);outline:none;box-shadow:0 0 0 3px rgba(46,134,193,.15)}
.form-panel{max-width:720px;margin:0 auto;width:100%}
.intro-bubble{background:#fff;border:1.5px solid var(--canal-light);border-radius:18px;padding:18px 20px;margin:18px auto;box-shadow:var(--shadow);text-align:left;max-width:720px}
.energy-pill{display:inline-flex;align-items:center;gap:8px;background:#E9F8F4;color:#0E7A66;border-radius:var(--r-pill);padding:8px 18px;font-weight:800;font-size:1.0625rem;border:1px solid #A9E2D6}
.hub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}
@media(max-width:860px){.hub-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.hub-grid{grid-template-columns:1fr}}
.chapter-card{background:#fff;border:1.5px solid #DCEBF2;border-radius:var(--r);padding:14px;cursor:pointer;transition:.2s;box-shadow:var(--shadow);text-align:left;min-height:44px}
.chapter-card:hover{transform:translateY(-3px);border-color:var(--canal)}
.chapter-card .cno{font-size:.8125rem;letter-spacing:3px;color:var(--gold);font-weight:700}
.chapter-card .cname{font-size:1.125rem;font-weight:800;color:var(--canal-deep);margin:2px 0}
.chapter-card .csub{font-size:.75rem;color:var(--ink-2);min-height:2.4em}
.chapter-card .cstate{margin-top:8px;font-size:.75rem}
.chapter-card.locked{opacity:.62;cursor:not-allowed}
.quad-guard{position:relative;margin:12px auto;max-width:440px;text-align:center}
.resume-banner{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:var(--z-rail);background:#fff;border:1.5px solid var(--gold);border-radius:var(--r-pill);padding:8px 12px 8px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:.875rem;max-width:92vw}
.resume-banner.hide{display:none}

/* ---------- 对话弹层 ---------- */
.chat-log{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:6px 2px}
.chat-msg{max-width:86%;padding:9px 13px;border-radius:14px;font-size:.9375rem;line-height:1.5;word-break:break-word}
.chat-msg.kid{align-self:flex-end;background:var(--canal);color:#fff;border-bottom-right-radius:4px}
.chat-msg.pet{align-self:flex-start;background:#F0F9FC;border:1px solid var(--canal-light);color:var(--ink);border-bottom-left-radius:4px}
.chat-msg .src{display:block;margin-top:5px;font-size:.6875rem;color:var(--ink-2)}
.chat-quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chat-quick button{background:#fff;border:1.5px solid var(--canal-light);color:var(--canal-deep);border-radius:var(--r-pill);padding:7px 13px;font-size:.8125rem;cursor:pointer;min-height:38px}
.chat-quick button:hover{background:var(--bg-soft)}
.chat-input{display:flex;gap:8px;margin-top:8px}
.chat-input input{flex:1}
.bag-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.bag-item{display:flex;gap:10px;align-items:center;background:var(--bg-soft);border:1px solid var(--canal-light);border-radius:var(--r-sm);padding:8px 11px;font-size:.875rem}
.bag-item .bid{font-weight:700;color:var(--canal-deep)}

/* ============================================================
   章内 deck / 文物观察屏 / 印记
   ============================================================ */
.deck-nav{flex-wrap:wrap}
.facts-list{margin:6px 0 0;padding-left:20px}
.facts-list li{margin-bottom:7px;font-size:.9375rem;color:var(--ink-2)}
.detail-chip{margin:0 8px 8px 0}
.art-head{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
@media(max-width:720px){.art-head{grid-template-columns:1fr}}
.art-svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.seal-bar{display:flex;gap:3px;justify-content:center;margin:2px 0}
.seal-dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid #CBD9E2;background:#fff;transition:.3s}
.energy-pill .seal-dot{vertical-align:middle}
.energy-pill.star-pill{background:#FFF6DA;color:#8A6420;border-color:#E6C877}

/* ============================================================
   T04 · 二级体验（GameEngine + 9 原语）
   ============================================================ */
.game-wrap{margin-top:8px}
.game-card{margin-top:8px}
.game-task{margin:12px 0;padding-top:10px;border-top:1px dashed #DCEBF2}
.game-task:first-child{border-top:none}
.gt-prompt{font-weight:600;color:var(--canal-deep);margin-bottom:8px}
.game-actions{margin-top:10px}
.game-fb{margin-top:8px;font-size:.9375rem;min-height:1.2em}
.explain-box{background:var(--bg-soft);border-radius:12px;padding:10px 12px}
.p-tip{font-size:.8125rem}
/* dragDrop */
.p-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.p-chip{background:#fff;border:1.5px solid var(--canal-light);border-radius:var(--r-pill);padding:8px 14px;font-size:.9375rem;cursor:grab;min-height:40px;color:var(--canal-deep)}
.p-chip:hover{background:var(--bg-soft)}
.p-chip.sel{background:var(--jade);color:#fff;border-color:var(--jade)}
.p-chip.used{opacity:.35}
.p-chip.dragging{opacity:.4}
.p-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.p-slot{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:#fff;border:2px dashed #C9DEE8;border-radius:12px;padding:8px 12px;min-height:56px;cursor:pointer;text-align:left}
.p-slot.hot{border-color:var(--jade);background:#EAF7F3}
.p-slot.filled{border-style:solid;border-color:var(--canal-light)}
.p-slot-lb{font-size:.75rem;color:var(--ink-2)}
.p-slot-v{font-size:.9375rem;font-weight:600;color:var(--canal-deep)}
.p-ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:var(--z-top);background:#fff;border:1.5px solid var(--canal-light);border-radius:var(--r-pill);padding:6px 12px;font-size:.875rem;box-shadow:var(--shadow-lg)}
/* tapRhythm */
.p-beats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.p-beat{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 8px;border-radius:12px;background:var(--bg-soft);border:1.5px solid var(--canal-light);color:var(--canal-deep);font-size:.8125rem}
.p-beat.pulse{background:var(--jade);color:#fff;transform:scale(1.08)}
.p-bell{display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;height:96px;margin:0 auto;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#FBE7BC,#E4B95E);cursor:pointer;box-shadow:0 6px 18px rgba(200,150,62,.35)}
.p-bell svg{width:38px;height:38px}
.p-bell-lb{font-size:.8125rem;font-weight:700;color:#8A6420}
.p-rhythm-ctl{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
/* slider */
.p-dials{display:grid;gap:10px;margin-bottom:10px}
.p-dial{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.p-dial span{grid-column:1 / -1;font-size:.875rem;color:var(--ink-2)}
.p-dial input[type=range]{width:100%}
.p-dial b{color:var(--canal-deep);min-width:2ch;text-align:center}
.p-gate{text-align:center;padding:10px;border-radius:12px;background:#FBE3DE;color:#8E2A1E;font-weight:700}
.p-gate.open{background:#CFF0E8;color:#0E7A66}
/* rotate */
.p-rotate{display:grid;justify-items:center;gap:8px}
.p-rot-stage{position:relative;width:150px;height:150px;display:grid;place-items:center}
.p-rot-obj{width:120px;height:120px;transition:transform .12s ease}
.p-rot-obj svg{width:100%;height:100%}
.p-rot-target{position:absolute;inset:0;border:2px dashed #C9DEE8;border-radius:50%}
.p-rotate input[type=range]{width:min(320px,90%)}
/* charge */
.p-charge{display:grid;gap:8px}
.p-meter{position:relative;height:26px;border-radius:var(--r-pill);background:#E3EFF5;border:1px solid #D3E6EF;overflow:hidden}
.p-green{position:absolute;top:0;bottom:0;background:rgba(22,160,133,.30)}
.p-force{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7FD3C0,var(--jade));transition:width .06s linear}
/* connect / trace */
.p-nodes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.p-node{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--canal-light);border-radius:12px;padding:10px 14px;font-size:.9375rem;cursor:pointer;min-height:44px;color:var(--canal-deep)}
.p-node:hover{background:var(--bg-soft)}
.p-node.on{background:var(--jade);border-color:var(--jade);color:#fff}
.p-node b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.35);font-size:.75rem}
.p-stitch{border-radius:50%;width:52px;height:52px;justify-content:center}
.p-stitch-line{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#C0392B 0 8px,transparent 8px 14px);margin-bottom:10px;opacity:.5}
.p-seq{font-size:.875rem;color:var(--ink-2)}
/* magnifier */
.p-mag-scene{position:relative;width:min(320px,90%);aspect-ratio:1/1;margin:0 auto 8px;border-radius:14px;overflow:hidden;background:#EDF4F7}
.p-mag-scene svg{width:100%;height:100%;display:block}
.p-spot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px dashed #C8963E;background:rgba(255,255,255,.5);cursor:pointer;font-weight:700;color:#0E7A66}
.p-spot.found{border-style:solid;border-color:var(--jade);background:#CFF0E8}
/* counter */
.p-bags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.p-bag{background:#fff;border:1.5px solid var(--canal-light);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px;color:var(--canal-deep)}
.p-bag.on{background:var(--jade);color:#fff;border-color:var(--jade)}
.p-count{font-size:1.1rem;font-weight:800;color:var(--canal-deep)}
.p-count b{font-size:1.6rem;color:var(--jade)}
/* draw */
.p-canvas{width:100%;max-width:340px;height:auto;border:1px solid #DCEBF2;border-radius:14px;touch-action:none;background:#FBFDFE;display:block;margin:8px auto}
.p-swatch{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;color:var(--ink-2)}
.p-swatch input[type=color]{width:44px;height:36px;border:none;background:none;padding:0}
/* design */
.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.design-grid{grid-template-columns:1fr}}
.p-palle{border:2px solid #DCEBF2;background:#fff;border-radius:var(--r-pill);padding:8px 14px;cursor:pointer;font-size:.875rem;color:var(--canal-deep);min-height:40px}
.p-palle.sel{border-color:var(--jade);box-shadow:0 0 0 2px rgba(22,160,133,.3);color:#0E7A66}

/* ============================================================
   T05 · 居家养成 / 评估报告 / 见面卡
   ============================================================ */
.home-row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #DCEBF2;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.home-ico{width:64px;height:64px;flex:none}
.home-ico svg{width:100%;height:100%}
.hr-h{font-weight:700}
.sense-item{padding:6px 0;border-bottom:1px dashed #E3EFF5}
.sense-item b{display:inline-block;width:2.4em;color:var(--canal-deep)}
.home-map .map-row{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed #E3EFF5}
.home-map .map-row b{min-width:6em;color:var(--canal-deep)}
.radar{width:min(300px,80vw);height:auto;display:block;margin:0 auto}
.badge-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:#F4F9FB;border:1px solid #E3EFF5;font-size:.75rem;color:var(--ink-2);text-align:center}
.badge-cell svg{width:52px;height:52px;filter:grayscale(1);opacity:.35}
.badge-cell.on{background:#fff;border-color:#DCEBF2;color:var(--canal-deep);box-shadow:var(--shadow)}
.badge-cell.on svg{filter:none;opacity:1}
.emo-chip{display:inline-block;margin:2px 8px 2px 0;font-size:.8125rem;color:var(--ink-2)}
.meet-card{max-width:520px;margin:0 auto}
.mc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px dashed #DCEBF2;padding-bottom:10px;margin-bottom:10px}
.mc-name{font-size:1.4rem;font-weight:900;color:var(--canal-deep)}
.mc-pet{width:120px;height:120px;flex:none}
.mc-pet svg{width:100%;height:100%}
.mc-body h3{margin:0 0 6px}

/* ============================================================
   打印：仅「见面卡 / 养成卡」
   ============================================================ */
@media print{
  body{background:#fff}
  body *{visibility:hidden!important}
  .printable,.printable *{visibility:visible!important}
  .printable{position:absolute;left:0;top:0;width:100%;box-shadow:none}
  .no-print{display:none!important}
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ============================================================
   参考图区（M20 · 同类器物参考 · 非本件）
   独立区域 · 默认折叠 · 懒注入 · 解码失败静默降级
   ============================================================ */
.ref-zone{margin-top:14px;border:1.5px dashed #C9DEE9;border-radius:var(--r);background:linear-gradient(180deg,#FCFEFF,#F1F8FB);padding:12px 14px}
.ref-title{font-size:1.0625rem;font-weight:800;color:var(--canal-deep);display:flex;align-items:center;gap:8px}
.ref-title::before{content:"";width:7px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--canal),var(--jade))}
.ref-badge{display:inline-flex;align-items:center;gap:6px;background:#FDF3E3;color:#8A6420;border:1px solid #EBD7AE;border-radius:var(--r-pill);padding:3px 11px;font-size:.8125rem;font-weight:800}
.ref-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.ref-meta{font-size:.8125rem;color:var(--ink-2)}
.ref-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.ref-body{margin-top:10px;animation:fadeIn .25s}
.ref-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.ref-fig img{display:block;width:auto;max-width:100%;max-height:44vh;border-radius:var(--r-sm);border:1px solid #DCEBF2;background:#fff;box-shadow:var(--shadow);cursor:zoom-in;transition:transform .22s}
.ref-fig img:hover{transform:scale(1.02)}
.ref-fig img:active{transform:scale(.99)}
.ref-fig figcaption{font-size:.8125rem;color:var(--ink-2);text-align:center;line-height:1.5}
.ref-note{margin:8px 0 0;background:#FFF7E8;border-left:4px solid var(--warn);border-radius:10px;padding:8px 11px;font-size:.875rem;color:#7A5320;font-weight:700}
.ref-note.soft{background:#F2F8FB;border-left-color:var(--canal-light);color:var(--ink-2);font-weight:400}
.ref-empty{margin-top:8px;background:#fff;border:1px solid #DCEBF2;border-radius:var(--r-sm);padding:10px 12px;font-size:.875rem;color:var(--ink-2)}
.ref-link{text-decoration:none}
.ref-zoom-box{max-width:min(94vw,900px)!important}
.ref-shot{text-align:center;background:var(--bg-soft);border-radius:14px;padding:10px}
.ref-shot img{display:block;margin:0 auto;width:auto;max-width:100%;max-height:56vh;border-radius:10px}

/* 无障碍：降低动态 */
/* ============================================================
   M22 · Motion（T08 动效层：三态 / 实体拖拽 / 灵宠纹饰）
   原则：只用 transform / opacity；微反馈 140ms、位移 300ms 内；尊重 reduced-motion
   ============================================================ */
:root{
  --pet-size:clamp(88px,23vw,176px);          /* 常驻游动灵宠：≥23vw（≤768px 视口仍 ≥22%），更宽屏封顶 176px */
  --pet-size-perched:clamp(52px,13vw,96px);   /* 栖位态 */
  --pet-hero:clamp(148px,30vw,264px);         /* 灵宠作为主体的展示框 */
  --pet-thumb:clamp(84px,19vw,124px);         /* 报告页缩略 */
}

/* ---------- ① 通用三态：hover / active / 完成（落地） ---------- */
.p-chip,.p-slot,.p-node,.p-bag,.p-palle,.p-spot,.beast-card,.detail-chip,.ref-toggle,.btn,.hud-btn{
  transition:transform .14s ease-out,box-shadow .14s ease-out,background .16s ease-out,border-color .16s ease-out,color .16s ease-out;
}
@media(hover:hover){
  .p-chip:hover,.p-node:hover,.p-bag:hover,.p-palle:hover,.p-spot:hover,.detail-chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,49,61,.14)}
  .p-slot:hover{border-color:var(--canal);background:#F6FBFD}
}
.p-chip:active,.p-node:active,.p-bag:active,.p-palle:active,.p-spot:active,.detail-chip:active{transform:scale(.94)}
.p-slot:active{transform:scale(.985)}
.p-chip:disabled,.p-node:disabled{opacity:.5;transform:none;box-shadow:none}
/* 完成态（落地）：落位回弹 / 吸附槽闪光 / 错位抖动 */
.p-chip.landed{animation:chipLand .36s cubic-bezier(.3,1.7,.6,1) 1}
@keyframes chipLand{0%{transform:scale(.84)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.p-chip.bounce{animation:chipBounce .44s cubic-bezier(.3,1.5,.6,1) 1}
@keyframes chipBounce{0%{transform:translateY(10px) scale(.95)}45%{transform:translateY(-6px) scale(1.05)}100%{transform:translateY(0) scale(1)}}
.p-slot.land{border-color:var(--jade);background:#E3F6F0;animation:slotFlash .55s ease-out 1}
@keyframes slotFlash{0%{box-shadow:0 0 0 0 rgba(22,160,133,.5)}100%{box-shadow:0 0 0 14px rgba(22,160,133,0)}}
.p-slot.wrong{border-color:var(--vermilion);animation:shakeX .36s ease-in-out 1}
@keyframes shakeX{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}38%{transform:translateX(7px)}58%{transform:translateX(-5px)}78%{transform:translateX(5px)}}

/* ---------- ② 实体拖拽：拾起放大 + 投影 + 倾斜；吸附槽高亮 ---------- */
.p-ghost{
  transform:translate(-50%,-50%) scale(1.08) rotate(-2.5deg);
  box-shadow:0 14px 28px rgba(20,49,61,.28);background:#fff;
  transition:box-shadow .16s ease-out,border-color .16s ease-out;
}
.p-ghost.over-slot{box-shadow:0 16px 32px rgba(22,160,133,.45);border-color:var(--jade)}
.p-chip.dragging{opacity:.3;transform:scale(.98)}
.p-slot.hot{transform:scale(1.045);border-color:var(--jade);background:#E9F8F3;box-shadow:0 0 0 4px rgba(22,160,133,.16)}

/* ---------- ③ 灵宠：尺寸 + 三层纹饰 + 次级动效 ---------- */
.pet-btn{width:var(--pet-size);height:var(--pet-size)}
.pet-btn.perched{width:var(--pet-size-perched);height:var(--pet-size-perched)}
.pet-hero{width:var(--pet-hero);height:var(--pet-hero);margin:6px auto;display:block}
.pet-hero>svg,.pet-thumb>svg,.mc-pet>svg{width:100%;height:100%;display:block}
.pet-thumb{width:var(--pet-thumb);height:var(--pet-thumb);display:block;margin:0 auto}
.mc-pet{width:var(--pet-hero);height:var(--pet-hero);flex:none}
svg .p-tex{pointer-events:none}
/* 次级动效 1：神兽特征滞后摆（作用在内层 <g>，不覆盖 SLOT 的 transform 属性） */
.pet-beastlag{transform-box:view-box;transform-origin:60px 62px;animation:beastLag 3.2s ease-in-out infinite}
@keyframes beastLag{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
/* 次级动效 2：随游动上浮的气泡粒子 */
.pet-bubbles circle{animation:bubUp 3.4s linear infinite;opacity:0}
.pet-bubbles circle:nth-child(2){animation-delay:1.2s}
.pet-bubbles circle:nth-child(3){animation-delay:2.4s}
@keyframes bubUp{0%{transform:translate(0,0);opacity:0}18%{opacity:.75}100%{transform:translate(-7px,-24px);opacity:0}}

/* ---------- ④ 拼图（T08 真拼块：不规则碎片 + 拖拽/旋转/吸附 + 拼缝闭合） ---------- */
.pz-wrap{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.25fr);gap:14px;align-items:start}
@media(max-width:660px){.pz-wrap{grid-template-columns:1fr}}
.pz-tray{background:#F3F9FC;border:1.5px dashed #C9DEE8;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-height:120px;align-content:start}
.pz-piece{border:none;background:none;padding:0;cursor:grab;touch-action:none;display:block;width:100%}
.pz-piece:active{cursor:grabbing}
.pz-rot-wrap{display:block;transition:transform .22s cubic-bezier(.3,1.6,.6,1);transform-origin:50% 50%}
.pz-piece svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 5px rgba(20,49,61,.20))}
@media(hover:hover){
  .pz-piece:hover svg{filter:drop-shadow(0 6px 12px rgba(20,49,61,.26))}
  .pz-piece:hover .pz-rot-wrap{transform:translateY(-3px)}
}
.pz-piece.picked{opacity:.35}
.pz-piece:focus-visible{outline:3px solid var(--vermilion);outline-offset:3px;border-radius:10px}
.pz-piece .pz-edge{fill:none;stroke:rgba(138,111,69,.5);stroke-width:1.6}
.pz-piece.zing{animation:pzZing .32s ease-out 1}
@keyframes pzZing{0%{transform:scale(1)}45%{transform:scale(.88)}100%{transform:scale(1)}}
.pz-rot{display:block;text-align:center;margin-top:1px;font-size:.6875rem;font-weight:800;color:#8A6420}
.pz-fly{position:fixed;pointer-events:none;z-index:var(--z-top);width:106px;transform:translate(-50%,-50%)}
.pz-fly svg{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 22px rgba(20,49,61,.34))}
.pz-slotwrap{position:relative;background:#fff;border:1.5px solid #DCEBF2;border-radius:14px;padding:6px}
.pz-board{width:100%;height:auto;display:block;touch-action:none}
.pz-slotp{fill:#EDF4F7;stroke:#BFD8E4;stroke-width:2;stroke-dasharray:8 6;transition:fill .16s ease-out,stroke .16s ease-out}
.pz-slotp.hot{fill:#DFF3EC;stroke:var(--jade);stroke-dasharray:none}
.pz-slotp.wrong{fill:#FBE3DE;stroke:var(--vermilion);stroke-dasharray:none;animation:shakeX .36s ease-in-out 1}
.pz-slotp.done{fill:none;stroke:none}
.pz-seam{fill:none;stroke:#8A6F45;stroke-width:1.5;stroke-dasharray:420;animation:pzSeam .75s ease-out 1}
@keyframes pzSeam{0%{stroke-dashoffset:420}100%{stroke-dashoffset:0}}
.pz-shine-fx{
  position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(105deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.88) 50%,rgba(255,255,255,0) 66%);
  background-size:260% 100%;animation:pzSweep .95s ease-out 1;
}
@keyframes pzSweep{0%{background-position:190% 0}100%{background-position:-90% 0}}
.pz-hint{margin-top:8px;font-size:.8125rem;color:var(--ink-2)}
.pz-hint.warn{color:#8E2A1E;font-weight:700}
.pz-empty{margin:8px 0 0;font-size:.8125rem;color:var(--ink-2)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .pet-btn.swim-east,.pet-btn.swim-west,.pet-btn.swim-south,.pet-btn.swim-north{animation:none}
}
</style>
</head>
<body>

<!-- 后台固定渐变层 -->
<div id="bgLayer" aria-hidden="true"></div>

<!-- 内联 SVG 符号库（懒注入，无跨文档引用） -->
<svg id="sprite" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"></svg>

<!-- 顶部常驻 HUD -->
<header class="hud" role="banner" aria-label="指挥官状态栏">
  <div class="hud-left">
    <div class="commander-badge" id="commanderBadge" role="img" aria-label="漕运指挥官徽章"></div>
    <div class="commander-meta">
      <div class="t1">漕运指挥官</div>
      <div class="t2" id="hudCode">漕运小将</div>
    </div>
  </div>
  <div class="hud-center">
    <div class="pet-mini" id="hudPet" role="img" aria-label="灵宠当前形态" aria-hidden="true"></div>
    <div class="energy-wrap">
      <div class="energy-bar" role="progressbar" aria-label="灵宠能量" aria-valuemin="0" aria-valuemax="600"><div id="energyFill"></div></div>
      <div class="energy-text" id="energyText">能量 0 · 灵宠「漕灵」</div>
    </div>
  </div>
  <div class="hud-right">
    <div class="stat seal-stat"><b id="hudSeals">0/4</b><div class="seal-bar" id="sealBar" role="img" aria-label="四方印记 0/4"></div><small>四方印记</small></div>
    <div class="stat"><b id="hudArtifacts">0/10</b><small>已完成文物</small></div>
    <div class="stat"><b id="hudStage">阶 0</b><small>灵宠阶位</small></div>
    <button class="hud-btn" id="btnChat" type="button" aria-label="和灵宠聊聊"><span id="btnChatIcon"></span></button>
    <button class="hud-btn" id="btnSound" type="button" aria-label="音效开关" aria-pressed="false"><span id="btnSoundIcon"></span></button>
  </div>
</header>

<!-- 右侧常驻 rail：章节导航 + 线索背包 -->
<nav class="rail" aria-label="常驻导航">
  <div class="chapter-nav" id="chapterNav" aria-label="章节进度导航"></div>
  <button class="nav-item" id="btnBag" type="button" aria-label="线索背包" style="justify-content:center"><span class="dot" style="border-color:var(--gold)"></span><span class="nl">线索背包</span></button>
</nav>

<!-- 路由舞台 -->
<main id="stage" role="main" aria-live="polite"></main>

<!-- 常驻灵宠层 -->
<div id="petLayer" aria-hidden="false"></div>

<!-- 继续上次探险横幅 -->
<div class="resume-banner hide" id="resumeBanner" role="status">
  <span id="resumeText">接着上次玩？</span>
  <button class="btn sm jade" id="resumeGo" type="button">继续</button>
  <button class="btn sm ghost" id="resumeSkip" type="button">重新开始</button>
</div>

<!-- 弹层 -->
<div id="scrim"></div>

/* ============================================================
 * M0 · Util（叶子模块）
 * ============================================================ */
var Util=(function(){
  function $(sel,root){ return (root||document).querySelector(sel); }
  function $$(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function clamp(v,a,b){ v=Number(v); if(!isFinite(v)) v=a; return Math.max(a,Math.min(b,v)); }
  function safeNum(v,d){ return (typeof v==='number'&&isFinite(v))?v:(typeof d==='number'?d:0); }
  function safeDiv(a,b){ a=safeNum(a,0); b=safeNum(b,0); return (b>0&&isFinite(a)&&isFinite(b))?a/b:0; }
  function pct(a,b){ return Math.round(safeDiv(a,b)*100); }
  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function pick(arr){ if(!arr||!arr.length) return null; return arr[randInt(0,arr.length-1)]; }
  function fmtDate(d){ d=d||new Date(); var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2); return y+'年'+m+'月'+day+'日'; }
  function fmtDur(sec){ sec=Math.max(0,Math.round(safeNum(sec,0))); var m=Math.floor(sec/60),s=sec%60; return m>0?(m+'分'+s+'秒'):(s+'秒'); }
  function debounce(fn,ms){ var t=null; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); },ms||60); }; }
  /* 事件总线：跨模块解耦通信 */
  var bus=(function(){
    var map={};
    return {
      on:function(evt,fn){ (map[evt]=map[evt]||[]).push(fn); return function(){ bus.off(evt,fn); }; },
      off:function(evt,fn){ var a=map[evt]||[]; var i=a.indexOf(fn); if(i>-1) a.splice(i,1); },
      emit:function(evt,payload){ (map[evt]||[]).slice().forEach(function(fn){ try{ fn(payload); }catch(e){ /* 总线不阻断 */ } }); }
    };
  })();
  /* 唯一的 id 序列（用于临时 DOM） */
  var _uid=0; function uid(p){ _uid++; return (p||'id')+'_'+_uid; }
  return { $:$, $$:$$, esc:esc, clamp:clamp, safeNum:safeNum, safeDiv:safeDiv, pct:pct,
           randInt:randInt, pick:pick, fmtDate:fmtDate, fmtDur:fmtDur, debounce:debounce, bus:bus, uid:uid };
})();

/* ============================================================
 * M1 · Store（状态单一来源 + 迁移 + 幂等守卫）
 * ============================================================ */
var Store=(function(){
  var SAVE_KEY_V2='canalCommander_v2';
  var SAVE_KEY_V1='canalCommander_v1'; /* 1.0 键：只读，用于迁移，绝不清除 */
  var state=null;

  /* ---- 2.0 默认状态（schema v2） ---- */
  function defaultState(){
    return {
      schemaVersion:2,
      createdAt:Date.now(), updatedAt:Date.now(),
      profile:{ commander:'', nickname:'', startTime:Date.now(), finishTime:null },
      pet:{
        beast:'', name:'', energy:0, stage:0,
        custom:{ palette:{main:'',accent:''}, motif:'none', extraFeatures:[], tags:[] },
        personality:{ key:'', scores:{}, tags:[] },
        lastReactAt:0, lastLines:[], praisedFeatures:[], onboardingHintCount:0
      },
      progress:{
        chapters:{ ch1:{intro:false,cleared:false,emotion:null}, ch2:{intro:false,cleared:false,emotion:null},
                   ch3:{intro:false,cleared:false,emotion:null}, ch4:{intro:false,cleared:false,emotion:null} },
        artifacts:{},
        seals:{ qinglong:false, zhuque:false, baihu:false, xuanwu:false },
        clues:[],
        lastRoute:{ stackIds:[], chapterId:null, actIndex:0 }
      },
      games:{},
      agent:{ turns:[], lastIntents:[], lastTopics:[], lastArtifactId:null, intentCounts:{}, boundaryCount:0, praiseCount:0 },
      creations:{
        puzzle:{done:false,rounds:0,ts:null},
        draw:{done:false,dataUrl:'',thumb:'',bytes:0,ts:null},
        draws:[],
        design:{done:false,snapshot:{},ts:null},
        dance:{done:false,moves:[],bars:0,ts:null},
        completedCount:0
      },
      home:{ plan:null, streak:0, days:{} },
      assessment:{ emotions:{}, literacyTags:[], badgesSeen:[] },
      settings:{ muted:false, lowStimulus:false, largeFont:false, refOpen:{} },
      ask:[],
      introDone:{}, birthBonus:false, reportSeen:false,
      log:[]
    };
  }

  /* ---- 字段兜底：任何版本都执行，保证代码永不读到 undefined ---- */
  function fillDefaults(s){
    if(!s||typeof s!=='object') return defaultState();
    var d=defaultState();
    function deep(base,dst){
      for(var k in base){
        var bv=base[k];
        if(bv&&typeof bv==='object'&&!Array.isArray(bv)){
          if(!dst[k]||typeof dst[k]!=='object'||Array.isArray(dst[k])) dst[k]={};
          deep(bv,dst[k]);
        } else if(Array.isArray(bv)){
          if(!Array.isArray(dst[k])) dst[k]=[];
        } else if(!(k in dst)||dst[k]==null){
          dst[k]=bv;
        }
      }
      return dst;
    }
    deep(d, s);
    if(!Array.isArray(s.log)) s.log=[];
    if(!s.progress||!Array.isArray(s.progress.clues)) { if(s.progress) s.progress.clues=[]; }
    return s;
  }

  /* ---- 1.0 章节进度映射（不可一一对应 → 记为章节进度） ---- */
  function mapLegacyChapters(completed, tasks){
    var out={};
    ['ch1','ch2','ch3','ch4'].forEach(function(c){ out[c]={intro:true,cleared:false,emotion:null}; });
    return out;
  }

  /* ---- migrate：永不抛错 ---- */
  function migrate(raw){
    try{
      if(!raw||typeof raw!=='object') return defaultState();
      var v=raw.schemaVersion|0;
      var s=raw;
      if(v<2){
        s=defaultState();
        s.profile.commander=raw.commander||'';
        s.profile.nickname=raw.chosenName||raw.commander||'';
        s.pet.name=raw.petName||raw.chosenName||'';
        s.pet.energy=Util.safeNum(Number(raw.energy),0);
        s.settings.muted=!!(raw.muted);
        s.introDone=raw.introDone||{};
        s.birthBonus=!!raw.birthBonus;
        s.reportSeen=!!raw.reportSeen;
        s.ask=Array.isArray(raw.ask)?raw.ask.slice(0,3):[];
        s.progress.chapters=mapLegacyChapters(raw.completed,raw.tasks);
        s.log=(Array.isArray(raw.log)?raw.log:[]).map(function(e){ e=e||{}; if(!e.v) e.v=1; return e; });
        if(raw.personality) s.pet.personality.key=raw.personality;
        if(Array.isArray(raw.choiceCreation)) s.pet.custom.tags=raw.choiceCreation.slice(0,4);
        s.schemaVersion=2;
      }
      s.schemaVersion=2;
      fillDefaults(s);
      s.updatedAt=Date.now();
      return s;
    }catch(e){
      /* 极端脏存档 → 起新档，但不动旧键（可回滚） */
      try{ Util.bus.emit('store:migrateFail',e); }catch(_){}
      return defaultState();
    }
  }

  function readKey(key){
    try{ var raw=localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){}
    return null;
  }

  function loadState(){
    var v2=readKey(SAVE_KEY_V2);
    if(v2){ state=migrate(v2); return state; }
    /* 尝试 1.0 存档迁移（保留旧键） */
    var v1=readKey(SAVE_KEY_V1);
    if(v1){
      state=migrate(v1);
      state._migratedFromV1=true;
      saveState(true);
      return state;
    }
    state=defaultState();
    return state;
  }

  var _save=Util.debounce(function(){ writeNow(); },60);
  function writeNow(){
    try{ state.updatedAt=Date.now(); localStorage.setItem(SAVE_KEY_V2,JSON.stringify(state)); }
    catch(e){ try{ Util.bus.emit('store:quota',e); }catch(_){} }
  }
  function saveState(force){
    if(!state) return;
    if(force) writeNow(); else _save();
  }

  function resetState(keepV1){
    state=defaultState(); writeNow();
    try{ localStorage.removeItem(SAVE_KEY_V2); }catch(e){}
    /* 绝不删除 1.0 键（可回滚） */
  }

  /* ---- 幂等守卫（2.0 全域唯一结算入口） ---- */
  var settledKeys=null;
  function ensureSettled(){
    if(settledKeys) return;
    settledKeys={};
    (state.log||[]).forEach(function(e){ if(e&&e.type==='settle') settledKeys[e.key]=true; });
  }
  function hasSettled(key){ ensureSettled(); return !!settledKeys[key]; }
  function settleOnce(key,fn){
    ensureSettled();
    if(settledKeys[key]) return false;
    settledKeys[key]=true;
    if(state&&state.log){ state.log.push({v:2,t:Date.now(),type:'settle',key:key}); }
    try{ if(typeof fn==='function') fn(); }catch(e){ try{ Util.bus.emit('settle:error',{key:key,error:e}); }catch(_){} }
    saveState(true);
    return true;
  }

  /* ---- 日志（版本化信封 v2） ---- */
  function logEvent(evt){
    evt=evt||{};
    evt.v=2; evt.t=Date.now();
    if(evt.energy==null) evt.energy=0;
    if(evt.durationSec==null) evt.durationSec=null;
    if(evt.textLen==null) evt.textLen=0;
    if(evt.dim===undefined) evt.dim=null;
    state.log.push(evt);
    saveState();
    return evt;
  }

  function set(fn){ /* 受控写入：fn(state) */
    try{ if(typeof fn==='function') fn(state); }catch(e){ Util.bus.emit('store:error',e); }
    saveState();
  }

  return {
    SAVE_KEY_V2:SAVE_KEY_V2, SAVE_KEY_V1:SAVE_KEY_V1,
    get state(){ return state; },
    defaultState:defaultState, fillDefaults:fillDefaults, migrate:migrate,
    loadState:loadState, saveState:saveState, resetState:resetState,
    settleOnce:settleOnce, hasSettled:hasSettled, logEvent:logEvent, set:set
  };
})();

    { id:'ld', missionTitle:'第六关情报 · 铁上的两个字', chapter:'ch2', order:6, name:'清「林工」铁锭', era:'清(1616~1911)', cat:'铜器、铁器及其他金属器',

    { id:'gh', missionTitle:'第七关情报 · 一把「说了算」的尺', chapter:'ch3', order:7, name:'清苏州府铭官斛', era:'清(1616~1911)', cat:'漆木竹器',

      facts:[
        '官斛，是苏州府发下来的"标准量器"。量粮叫"起米过斛"——满满一斛，大约 35.8 公斤（五斗），比你还重哦！',

        '有人会在验收时作弊：用不合标准的量器、加尖、浮收、折色。你要做的，就是用官斛这个标准量器，一斛一斛去核对账目。',

        '小注：「五斗」是清代量制——清代 1 石 = 2 斛 = 10 斗，所以 1 斛 = 5 斗（宋以前是 1 斛 = 10 斗，可别算错啦）。',
      ],
      intelUse:[

      clue:{ id:'clue-gh-1', text:'官斛容量＝换算依据 → 算出「应收」，才能发现异常' } },

/* ============================================================
 * M20 · RefImg（参考图区：同类器物参考 · 非本件）
 * 离线内嵌（base64，file:// 双击即见）；默认折叠，展开时才注入 img.src（不阻塞首屏）；
 * 解码失败 onerror → 静默降级（撤掉图、只留文字与外链，绝不破版）；
 * 点击可放大 + 查看「来源详情」（Overlays）。
 * 红线：本模块只做展示与「已看过」埋点，绝不触发任何结算（energy / clue / game）。
 * ============================================================ */
var RefImg=(function(){
  var ZID='screen-ref-zoom', bound=false, seen={};

  function def(id){ return (Data.refImages&&Data.refImages[id])||null; }
  function has(id){ return !!def(id); }
  function official(id){ var m=Data.officialLinks||{}; return m[id]||null; }
  function E(s){ return Util.esc(s==null?'':String(s)); }
  function link(url,label){
    if(!url) return '';

      Assets.icon('u-external',null,label)+' '+E(label)+'</a>';
  }

  /* ---- 展开埋点：只记「看过」，不结算（架构 §2.8 settings.refOpen） ---- */
  function mark(id){
    if(!id||seen[id]) return;
    seen[id]=true;
    try{
      var st=Store.state;
      if(st&&st.settings){
        if(!st.settings.refOpen||typeof st.settings.refOpen!=='object') st.settings.refOpen={};
        st.settings.refOpen[id]=true;
      }
      Store.saveState();
    }catch(e){}
  }
  function seenCount(){ return Object.keys(seen).length; }

  /* ---- 参考图区（文物页独立一块，与手绘主视觉并列但不混排） ---- */
  function zoneHTML(id){
    var r=def(id);
    var head='<div class="ref-title">真实的它（同类器物参考）</div>';
    var off=official(id);
    var offRow='<div class="row" style="margin-top:8px">'+
      link(off,'前往扬州中国大运河博物馆 · 查看原件（外部链接）')+'</div>';
    if(!r){
      return '<div class="ref-zone" data-ref-zone="'+E(id)+'">'+head+
        '<div class="ref-empty">这件暂无合规的同类参考图——请看下面的手绘细节。'+offRow+'</div>'+
        '</div>';
    }
    return '<div class="ref-zone" data-ref-zone="'+E(id)+'">'+head+
      '<div class="ref-row"><span class="ref-badge"><span class="dot"></span>同类器物参考 · 非本件</span>'+
        '<span class="ref-meta">馆藏：'+E(r.museum)+' ｜ 授权：'+E(r.licenseCH)+'</span></div>'+
      '<div class="row" style="margin-top:8px"><button class="btn sm ghost ref-toggle" type="button" data-ref-toggle="'+E(id)+
        '" aria-expanded="false" aria-controls="refbody-'+E(id)+'">'+
        Assets.icon('u-magnifier',null,'参考图')+' 展开看参考图</button></div>'+
      '<div class="ref-body" id="refbody-'+E(id)+'" data-ref-body="'+E(id)+'" hidden></div>'+
      offRow+
      '</div>';
  }

  function figHTML(id){
    var r=def(id); if(!r) return '';
    var alt='同类器物参考图 · 非本件：'+(r.titleCH||r.museum);
    var h='';
    if(r.hint) h+='<p class="ref-note">'+E(r.hint)+'</p>';
    if(r.hint2) h+='<p class="ref-note soft">'+E(r.hint2)+'</p>';
    return '<figure class="ref-fig">'+
        '<img alt="'+E(alt)+'" data-ref-img="'+E(id)+'">'+
        '<figcaption>'+E((r.titleCH?r.titleCH+' ｜ ':'')+r.museum+'藏 ｜ 授权：'+r.licenseCH)+

      '</figure>'+
      '<p class="muted" style="font-size:.8125rem;margin-top:6px">点图可放大；「来源详情」里有原图页与授权说明。</p>'+
      '<p class="ref-empty" data-ref-degrade hidden>这张参考图在本机加载失败——看图请用上面的手绘细节，或去博物馆看原件。</p>'+
      h;
  }

  /* ---- 展开即注入 src（懒注入：首屏只解码手绘 SVG） ---- */
  function expand(zone,id,btn){
    var body=Util.$('[data-ref-body="'+id+'"]',zone);
    if(!body) return false;
    var loaded=body.getAttribute('data-ref-loaded')==='1';
    if(loaded){
      body.hidden=!body.hidden;
      if(btn){ btn.setAttribute('aria-expanded',body.hidden?'false':'true');
        btn.innerHTML=Assets.icon('u-magnifier',null,'参考图')+' '+(body.hidden?'展开看参考图':'收起参考图'); }

    if(img){
      /* 解码失败：撤掉图（含图注），只显示降级文案，绝不破版 */
      img.onerror=function(){
        try{
          var fig=img.parentNode; if(fig&&fig.parentNode) fig.parentNode.removeChild(fig);

        }catch(e){}

      img.src=r.b64;
    }
    body.setAttribute('data-ref-loaded','1');
    body.hidden=false;
    if(btn){ btn.setAttribute('aria-expanded','true');
      btn.innerHTML=Assets.icon('u-magnifier',null,'参考图')+' 收起参考图'; }
    mark(id);

  }

  /* ---- 放大 + 来源详情 ---- */
  function render(opts){
    var id=opts.refId, r=def(id);
    if(!r) return '<div class="overlay-box">参考图缺失</div>';
    var a=Data.artifactById[id]||{};
    return '<div class="overlay-box ref-zoom-box">'+
      '<div class="overlay-head"><h3>同类器物参考 · 非本件</h3>'+

      '<div class="ref-shot"><img alt="'+E('同类器物参考图 · 非本件：'+(r.titleCH||r.museum))+'" data-ref-zoom-img="'+E(id)+'"></div>'+
      (r.hint?'<p class="ref-note">'+E(r.hint)+'</p>':'')+
      (r.hint2?'<p class="ref-note soft">'+E(r.hint2)+'</p>':'')+
      '<div class="section-title" style="font-size:1rem">来源详情</div>'+
      '<ul class="facts-list">'+
        '<li>本件文物：'+E(a.name||'')+'（扬州中国大运河博物馆藏）</li>'+
        '<li>参考器物：'+E(r.titleCH||'')+'</li>'+
        '<li>馆藏机构：'+E(r.museum)+'</li>'+
        '<li>授权方式：'+E(r.licenseCH)+'</li>'+
        '<li>许可名称：'+E(r.license)+'</li>'+
        (r.artifactNo?'<li>参考器物编号：'+E(r.artifactNo)+'</li>':'')+
        '<li>素材性质：开放获取（Open Access）馆藏图库同类器物照，非本件文物实拍</li>'+
      '</ul>'+
      '<div class="row">'+
        link(r.pageUrl,'查看参考器物原图页')+
        link(r.licenseUrl,'查看授权说明')+
        link(official(id),'查看本件原件（博物馆外链）')+
      '</div>'+
      '<p class="note">参考图不是本件文物的照片；本件造型请以手绘细节与官方藏品数据为准。</p>'+
      '</div>';
  }
  function onMount(root,opts){
    var id=opts.refId, r=def(id);
    var img=Util.$('[data-ref-zoom-img="'+id+'"]',root);
    if(img&&r){
      img.onerror=function(){ try{ img.style.display='none'; }catch(e){} };
      img.src=r.b64;
    }
    var c=Util.$('#refZoomClose',root);
    if(c) c.onclick=function(){ close(); };
  }
  function open(id){ if(!def(id)) return; mark(id); Overlays.open(ZID,{ label:'参考图 · 同类器物参考（非本件）', dismissable:true, refId:id }); }
  function close(){ Overlays.close(ZID); }
  function bind(){ if(bound) return; bound=true; Overlays.register(ZID,{ label:'参考图', dismissable:true, render:render, onMount:onMount }); }

  /* ---- 事件绑定（同屏重建后重挂） ---- */
  function wire(scope){
    var root=scope||document;
    var t=Util.$('[data-ref-toggle]',root);
    if(t) t.onclick=function(){
      Audio.play('ui_tap');
      var zone=null; try{ zone=t.closest('[data-ref-zone]'); }catch(e){}
      expand(zone||root,t.getAttribute('data-ref-toggle'),t);
    };
  }

  return { has:has, zoneHTML:zoneHTML, expand:expand, open:open, close:close,
           render:render, bind:bind, wire:wire, seenCount:seenCount, official:official };
})();

/* ============================================================
 * M4 · Audio（懒初始化 + master + 单 BGM 互斥 + 4 章 BGM 合成）
 * ============================================================ */
var Audio=(function(){
  var ctx=null, masterGain=null, nodesMap={}, current=null, desired=null;

  function ac(){
    if(ctx) return ctx;
    try{
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C) return null;
      ctx=new C();
      masterGain=ctx.createGain();
      masterGain.gain.value=isMuted()?0:0.9;
      masterGain.connect(ctx.destination);
    }catch(e){ ctx=null; masterGain=null; }
    return ctx;
  }
  function master(){
    var a=ac(); if(!a) return null;
    if(!masterGain){ masterGain=a.createGain(); masterGain.gain.value=isMuted()?0:0.9; masterGain.connect(a.destination); }
    return masterGain;
  }
  function init(){ return ac(); }
  function resume(){ var a=ac(); if(!a) return false; try{ if(a.state==='suspended'&&a.resume) a.resume(); if(desired&&!current) loopBGM(desired); return true; }catch(e){ return false; } }

  function isMuted(){ try{ return !!(Store.state&&Store.state.settings&&Store.state.settings.muted); }catch(e){ return false; } }
  function setMuted(b){
    try{ Store.state.settings.muted=!!b; Store.saveState(true); }catch(e){}
    try{ if(masterGain){ var t=ac().currentTime; masterGain.gain.cancelScheduledValues(t); masterGain.gain.linearRampToValueAtTime(b?0:0.9,t+0.15); } }catch(e){}
    if(b){ stopBGM(true); } else if(desired){ loopBGM(desired); }
    Util.bus.emit('audio:mute',!!b);
    return !!b;
  }

  /* ---- 底层发声原语 ---- */
  function toneTo(a,dest,freq,dur,type,vol,when,glideTo){
    if(!a||!dest) return;
    try{
      var t0=when||a.currentTime;
      var o=a.createOscillator(), g=a.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
      if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,glideTo),t0+dur);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.04);
    }catch(e){}
  }
  function noiseBuf(a){
    try{
      var len=Math.floor(a.sampleRate*0.5), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
      return buf;
    }catch(e){ return null; }
  }
  function noiseTo(a,dest,dur,vol,when,filterFreq,type){
    if(!a||!dest) return;
    try{
      var src=a.createBufferSource(); src.buffer=noiseBuf(a); if(!src.buffer) return;
      var f=a.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=filterFreq||900; f.Q.value=1.2;
      var g=a.createGain(); var t0=when||a.currentTime;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      src.connect(f); f.connect(g); g.connect(dest); src.start(t0); src.stop(t0+dur+0.02);
    }catch(e){}
  }

  /* ---- 音效（SFX） ---- */
  var sfx={
    ui_tap:function(d){ toneTo(ac(),d,660,0.08,'triangle',0.10); },
    ui_correct:function(d){ var a=ac(),t=a?a.currentTime:0; toneTo(a,d,660,0.14,'sine',0.14,t); toneTo(a,d,880,0.16,'sine',0.12,t+0.12); toneTo(a,d,990,0.22,'sine',0.12,t+0.24); },
    ui_gentle:function(d){ var a=ac(),t=a?a.currentTime:0; toneTo(a,d,523,0.18,'sine',0.10,t); toneTo(a,d,392,0.22,'sine',0.08,t+0.12); },
    level_up:function(d){ var a=ac(),t=a?a.currentTime:0; [523,659,784,1047].forEach(function(f,i){ toneTo(a,d,f,0.35,'triangle',0.14,t+i*0.11); }); },
    seal:function(d){ var a=ac(),t=a?a.currentTime:0; [392,588,980].forEach(function(f,i){ toneTo(a,d,f,1.2,'sine',0.10,t+i*0.02); }); toneTo(a,d,196,1.4,'sine',0.06,t); },
    water_splash:function(d){ var a=ac(),t=a?a.currentTime:0; toneTo(a,d,300,0.3,'sine',0.10,t,900); noiseTo(a,d,0.25,0.06,t,1200,'bandpass'); },
    bell_ring:function(d){ var a=ac(),t=a?a.currentTime:0; [1320,1760,2640].forEach(function(f,i){ toneTo(a,d,f,0.5-i*0.1,'sine',0.08,t+i*0.02); }); },
    drum_beat:function(d){ var a=ac(),t=a?a.currentTime:0; toneTo(a,d,120,0.15,'sine',0.20,t,70); noiseTo(a,d,0.06,0.10,t,300,'lowpass'); },
    market_cry:function(d){ var a=ac(),t=a?a.currentTime:0; for(var i=0;i<8;i++){ toneTo(a,d,700+((i%3)*90),0.12,'sawtooth',0.05,t+i*0.14); } noiseTo(a,d,1.2,0.05,t,1400,'bandpass'); },
    rotate_click:function(d){ noiseTo(d,0.06,0.10,null,2000,'highpass'); }
  };
  function play(name){
    if(isMuted()) return false;
    var a=ac(); if(!a) return false;
    try{ if(a.state==='suspended'&&a.resume) a.resume(); }catch(e){}
    var d=master(); if(!d) return false;
    try{ (sfx[name]||function(){})(d); }catch(e){}
    return true;
  }

  /* ---- 4 章 BGM 合成配方（编钟 / 夯土号子 / 更鼓 / 市集叫卖） ---- */
  function motif(a,d,t,freqs,type,vol,step){ (freqs||[]).forEach(function(f,i){ toneTo(a,d,f,0.5,type||'sine',vol||0.08,t+i*(step||0.3)); }); }
  var patterns={
    bgm_oath:{ bpm:60, beatsPerBar:4, barDur:4, vol:0.5,
      render:function(a,d,t){ motif(a,d,t,[196,294,392],'sine',0.06,0.5); toneTo(a,d,98,3.8,'triangle',0.05,t); } },
    bgm_ch1:{ bpm:72, beatsPerBar:4, barDur:3.33, vol:0.5,
      render:function(a,d,t){ motif(a,d,t,[261,392,523],'sine',0.06,0.6); motif(a,d,t+1.6,[294,392],'sine',0.05,0.6); noiseTo(a,d,2.6,0.03,t,400,'lowpass'); } },
    bgm_ch2:{ bpm:92, beatsPerBar:4, barDur:2.6, vol:0.5,
      render:function(a,d,t){ for(var i=0;i<4;i++){ toneTo(a,d,i%2?180:150,0.2,'triangle',0.09,t+i*0.65); } noiseTo(a,d,0.1,0.06,t,260,'lowpass'); toneTo(a,d,520,0.3,'square',0.03,t+1.3); } },
    bgm_ch3:{ bpm:80, beatsPerBar:4, barDur:3, vol:0.5,
      render:function(a,d,t){ toneTo(a,d,110,0.3,'sine',0.12,t,80); toneTo(a,d,110,0.3,'sine',0.10,t+1.5); motif(a,d,t+0.6,[660,880],'triangle',0.04,0.3); noiseTo(a,d,0.08,0.05,t+0.75,2200,'highpass'); } },
    bgm_ch4:{ bpm:100, beatsPerBar:4, barDur:2.4, vol:0.5,
      render:function(a,d,t){ for(var i=0;i<6;i++){ toneTo(a,d,720+((i%4)*70),0.14,'sawtooth',0.035,t+i*0.38); } noiseTo(a,d,2.0,0.03,t,1500,'bandpass'); toneTo(a,d,392,0.4,'triangle',0.05,t+1.2); } },
    bgm_clear:{ bpm:66, beatsPerBar:4, barDur:3.6, vol:0.5,
      render:function(a,d,t){ motif(a,d,t,[392,523,659,784],'sine',0.06,0.45); toneTo(a,d,196,3.4,'triangle',0.05,t); } },
    haozi_ram:{ bpm:112, beatsPerBar:4, barDur:2.14, vol:0.5,
      render:function(a,d,t){ for(var i=0;i<4;i++){ toneTo(a,d,i%2?220:165,0.22,'triangle',0.10,t+i*0.53); } } }
  };

  function stopNode(node,fade){
    if(!node) return;
    try{ if(node.timer) clearInterval(node.timer); }catch(e){}
    try{
      var t=ac().currentTime;
      node.gain.gain.cancelScheduledValues(t);
      node.gain.gain.setValueAtTime(node.gain.gain.value,t);
      node.gain.gain.linearRampToValueAtTime(0.0001,t+(fade||0.6));
      setTimeout(function(){ try{ node.gain.disconnect(); }catch(e){} try{ if(node.timer) clearInterval(node.timer); }catch(e){} },(fade||0.6)*1000+120);
    }catch(e){}
    if(nodesMap[node.id]===node) delete nodesMap[node.id];
  }
  function startBGM(id,fadeIn){
    var a=ac(); if(!a) return false;
    var pat=patterns[id]; if(!pat) return false;
    try{
      var g=a.createGain(); g.gain.value=0.0001; g.connect(master());
      var barDur=pat.barDur||3;
      var node={ id:id, gain:g, timer:null, next:a.currentTime+0.08 };
      function tick(){
        var a2=ac(); if(!a2) return;
        try{
          var guard=0;
          while(node.next < a2.currentTime + barDur*2 && guard<8){ pat.render(a2,g,node.next); node.next+=barDur; guard++; }
        }catch(e){}
      }
      tick();
      node.timer=setInterval(tick,Math.max(150,barDur*500));
      g.gain.setValueAtTime(0.0001,a.currentTime);
      g.gain.exponentialRampToValueAtTime(pat.vol||0.5,a.currentTime+(fadeIn||0.8));

/* ============================================================
 * M11 · Chapter（四章场景 · 章内 deck · 文物观察屏 · 印记点亮）
 * 结算只由显式动作触发；交互态↔完成态一律 outerHTML 整体替换（杜绝节点累积）
 * ============================================================ */
var Chapter=(function(){
  var BUILD_STEP=20, SEAL_ENERGY=40;

  /* ---- 交互态 ↔ 完成态：outerHTML 整体替换容器（禁止 append 累积） ---- */
  function replaceNode(el,html){
    if(!el||!el.parentNode) return false;
    var out=String(html||'').trim();
    if(!out) return false;
    el.outerHTML=out;
    return true;
  }

  function slidesFor(chId){
    var out=[{ kind:'intro' }];
    Data.artifactsOfChapter(chId).forEach(function(a){
      out.push({ kind:'art', artifactId:a.id });
      if(Data.gameOfArtifact(a.id)) out.push({ kind:'game', artifactId:a.id });
    });
    out.push({ kind:'clear' });
    return out;
  }
  function chId(){ var c=Router.current(); return (c&&c.params&&c.params.chapterId)||'ch1'; }
  function rootEl(){ return Util.$('#screen-ch'); }

  /* ---- 章节外壳 ---- */
  function build(params){
    var c=Data.chapterById[(params&&params.chapterId)||'ch1']||Data.chapters[0];
    var b=Data.beasts[c.beast];
    return '<div class="screen-inner">'+
      '<div class="chapter-hero" style="text-align:center">'+
        '<div class="chapter-no" style="font-size:.8125rem;letter-spacing:4px;color:var(--gold);font-weight:700">'+Util.esc(c.no)+' · '+Util.esc(b.dirLabel)+'方 '+Util.esc(b.name)+'</div>'+
        '<div class="chapter-name" style="font-size:clamp(26px,6vw,42px);font-weight:900;color:'+b.main+';margin:6px 0">'+Util.esc(c.name)+'</div>'+
        '<div class="chapter-part muted">'+Util.esc(c.part)+'</div>'+
      '</div>'+
      '<div id="deckWrap" style="margin-top:14px">'+
        '<div id="deckBody"></div>'+
        '<div class="deck-nav" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px">'+
          '<button class="btn ghost sm" id="deckPrev" type="button">上一幕</button>'+
          '<span class="muted" id="deckPos" aria-live="polite">第 1 幕</span>'+
          '<button class="btn sm" id="deckNext" type="button">下一幕</button>'+
        '</div>'+
      '</div>'+
      '<div class="center" style="margin-top:10px"><button class="btn ghost sm" id="chBack" type="button">返回指挥官舱</button></div>'+
    '</div>';
  }
  function mount(root){
    root=root||rootEl(); if(!root) return;
    var prev=Util.$('#deckPrev',root), next=Util.$('#deckNext',root), back=Util.$('#chBack',root);
    if(prev) prev.onclick=function(){ var t=Router.current(); if(t&&t.deckIndex>0){ Audio.play('ui_tap'); Router.setAct(t.deckIndex-1); } };
    if(next) next.onclick=function(){
      var t=Router.current(); var m=slidesFor(chId()).length;
      if(t&&t.deckIndex<m-1){ Audio.play('ui_tap'); Router.setAct(t.deckIndex+1); } else { Toast('这一章已经走到最后啦'); }
    };
    if(back) back.onclick=function(){ Audio.play('ui_tap'); Router.push('screen-hub'); };
    renderSlide((Router.current()&&Router.current().deckIndex)||0);
  }
  function onAct(i){ renderSlide(Util.safeNum(i,0)); }

  function renderSlide(i){
    var root=rootEl(); if(!root) return;
    var ch=chId(), slides=slidesFor(ch);
    var idx=Util.clamp(i,0,slides.length-1);
    var body=Util.$('#deckBody',root); if(!body) return;
    var s=slides[idx];
    var html='';
    if(s.kind==='intro') html=slideIntro(ch);
    else if(s.kind==='art') html=slideArtifact(ch,s.artifactId,idx);
    else if(s.kind==='game') html=slideGame(ch,s.artifactId);
    else html=slideClear(ch);
    try{ Games.teardown(); }catch(e){}   /* 离开任一幕先停掉原语计时器，杜绝后台结算 */
    body.innerHTML=html;
    var pos=Util.$('#deckPos',root); if(pos) pos.textContent='第 '+(idx+1)+' / '+slides.length+' 幕';
    var prev=Util.$('#deckPrev',root), next=Util.$('#deckNext',root);
    if(prev) prev.disabled=(idx===0);
    if(next) next.disabled=(idx===slides.length-1);
    wireSlide(ch,s,body,slides.length,idx);
  }

  /* ---- 幕 1：引子 ---- */
  function slideIntro(ch){
    var c=Data.chapterById[ch], b=Data.beasts[c.beast];
    var done=Store.hasSettled('chapter:'+ch+':intro');
    return '<div class="card" data-part-body>'+
      '<div class="tag" style="background:'+b.accent+';color:'+b.main+'">危机 · '+Util.esc(c.crisis)+'</div>'+
      '<h3 style="color:'+b.main+';margin:8px 0">你的任务：'+Util.esc(c.mission)+'</h3>'+
      '<p class="muted">挡路的家伙（可以和好哦）：<b>'+Util.esc(c.villain)+'</b>——'+Util.esc(c.villainNote)+'</p>'+
      '<p class="muted"><b>你手上的线索：</b>'+Util.esc(c.clue)+'</p>'+
      '<p class="muted"><b>为什么现在非知道它不可？</b>'+Util.esc(c.knowledgeNeeded)+'</p>'+
      (done
        ? '<div class="energy-pill" style="margin-top:8px">'+Assets.icon('u-check',null,'已完成')+' 任务已接下</div>'
        : '<button class="btn jade" id="introGo" type="button">接下任务，出发！</button>')+
      '</div>';
  }
  function wireIntro(ch,body){
    var go=Util.$('#introGo',body);
    if(go) go.onclick=function(){
      Audio.play('ui_tap');
      Store.settleOnce('chapter:'+ch+':intro',function(){
        var p=Store.state.progress.chapters[ch]||(Store.state.progress.chapters[ch]={intro:false,cleared:false,emotion:null});
        p.intro=true;
        Store.logEvent({ type:'chapter_intro', chapter:ch, dim:(Data.chapterById[ch]||{}).dim, literacy:'乐学善学' });
      });
      Audio.loopBGM((Data.chapterById[ch]||{}).bgm||'bgm_ch1',0.6);
      var container=Util.$('[data-part-body]',body);
      replaceNode(container,'<div class="card" data-part-body><div class="energy-pill">'+Assets.icon('u-check',null,'已完成')+' 任务已接下</div><p class="muted" style="margin-top:8px">点「下一幕」，去看看这一段水路留下的文物。</p></div>');
      Toast('使命已接受');
    };
  }

  /* ---- 幕 N：文物观察屏 ---- */
  function slideArtifact(ch,artId,slideIdx){
    var a=Data.artifactById[artId];
    if(!a) return '<div class="card">文物数据缺失</div>';
    var b=Data.beasts[(Data.chapterById[ch]||{}).beast]||Data.beasts.qinglong;
    var rec=Store.state.progress.artifacts[artId];
    var observed=!!(rec&&rec.observed);
    var details=(a.details||[]).map(function(d,i){
      return '<button class="btn sm ghost detail-chip" type="button" data-detail="'+Util.esc(d.key)+'" aria-label="查看细节：'+Util.esc(d.label)+'">'+Assets.icon('u-magnifier',null,'细节')+' '+Util.esc(d.label)+'</button>';
    }).join('');
    var bodyHtml=
      '<div class="art-head">'+
        '<div style="background:linear-gradient(160deg,#fff,#EAF4F8);border:1px solid #DCEBF2;border-radius:16px;padding:8px;text-align:center">'+Assets.artSVG(a.id)+'</div>'+
        '<div>'+
          '<h3 style="color:'+b.main+'">'+Util.esc(a.name)+'</h3>'+
          '<p class="muted">'+Util.esc(a.era)+' · '+Util.esc(a.cat)+' · '+Util.esc(a.size)+'</p>'+
          '<p class="muted">'+Util.esc(a.hall)+'</p>'+
          '<p>'+Util.esc(a.joy||'')+'</p>'+
          '<p class="note">造型依据：'+Util.esc(a.source)+'（高精度自绘 SVG，未使用本件藏品实拍图）</p>'+
        '</div>'+
      '</div>'+
      RefImg.zoneHTML(a.id)+
      '<div class="section-title">点一点，看看它的细节</div>'+
      '<div class="row" data-detail-bar>'+details+'</div>'+
      '<div class="section-title">'+Util.esc(a.missionTitle||'本关情报')+'</div>'+
      '<ul class="facts-list">'+(a.facts||[]).map(function(f,i){ var u=''; var s=(a.intelUse&&a.intelUse[i])||''; if(s){ var k=s.indexOf('：'); u=(k>0&&k<=8)?('<b class="intel">'+Util.esc(s.slice(0,k))+'</b>'+Util.esc(s.slice(k))+' '):('<b class="intel">情报用途：</b>'+Util.esc(s)+' '); } return '<li>'+u+Util.esc(f)+'</li>'; }).join('')+'</ul>';
    var footHtml= observed
      ? observedFoot(a)
      : '<div class="part" data-part-body><button class="btn jade" id="observeGo" type="button">我看完了，走吧</button><p class="muted" style="margin-top:6px">先点开细节、读一读，再按这个按钮。</p></div>';
    return '<div class="card">'+
      '<div class="tag" style="background:'+b.accent+';color:'+b.main+'">第 '+slideIdx+' 件 · 观察与线索</div>'+
      bodyHtml+
      '<div class="part" style="margin-top:12px">'+footHtml+'</div>'+
      '</div>';
  }
  function observedFoot(a){
    return '<div class="part" data-part-body>'+
      '<div class="energy-pill">'+Assets.icon('u-check',null,'已完成')+' 已观察并记下线索</div>'+
      '<p class="muted" style="margin-top:6px"><b>线索入包：</b>'+Util.esc(a.clue?a.clue.text:'')+'</p>'+
      '</div>';
  }
  function wireArtifact(ch,artId,body){
    /* 参考图区（同类器物参考 · 非本件）：懒注入 + 放大；0 结算 */
    try{ RefImg.wire(body); }catch(e){ Util.bus.emit("refimg:error",e); }
    /* 细节按钮 → DetailOverlay（结算在 DetailOverlay 内幂等） */
    var bar=Util.$('[data-detail-bar]',body);
    if(bar) bar.onclick=function(e){
      var t=e.target.closest('[data-detail]'); if(!t) return;
      Audio.play('ui_tap');
      DetailOverlay.open(artId,0,t.getAttribute('data-detail'));
    };
    var go=Util.$('#observeGo',body);
    if(go) go.onclick=function(){
      /* 幂等结算：观察 + 线索入包 + 能量（仅显式动作触发） */
      var isNew=Store.settleOnce('observe:'+artId,function(){
        var st=Store.state;
        var rec=st.progress.artifacts[artId]||(st.progress.artifacts[artId]={observed:false,detailsOpened:{},gameDone:false,gameSettled:false,accuracy:0});
        rec.observed=true;
        var a=Data.artifactById[artId];
        if(a&&a.clue&&st.progress.clues.filter(function(x){ return x.id===a.clue.id; }).length===0){
          st.progress.clues.push({ id:a.clue.id, chapter:a.chapter, from:a.id, order:a.order, text:a.clue.text, usedBy:null, grantedAt:Date.now() });
        }
        Store.logEvent({ type:'observe', chapter:ch, artifactId:artId, dim:(Data.chapterById[ch]||{}).dim, literacy:'人文积淀' });
      });
      if(isNew) addEnergy(BUILD_STEP,'观察文物 · '+Util.esc(Data.artifactById[artId].name));
      var a=Data.artifactById[artId];
      var container=Util.$('[data-part-body]',body);
      replaceNode(container,observedFoot(a));
      Toast(isNew?'线索已入包':'线索已在背包里');
    };
  }

  /* ---- 幕 N+1：二级体验（GameEngine 挂载；结算只由显式动作触发） ---- */
  function slideGame(ch,artId){
    var g=Data.gameOfArtifact(artId);
    if(!g) return '<div class="card">这件文物暂无二级体验。</div>';
    var done=!!(Store.state.games[g.id]&&Store.state.games[g.id].done);
    var b=Data.beasts[(Data.chapterById[ch]||{}).beast]||Data.beasts.qinglong;
    return '<div class="game-wrap">'+
      '<div class="tag" style="background:'+b.accent+';color:'+b.main+'">二级体验 · '+(done?'已完成':'待挑战')+'</div>'+
      '<div id="gameHost"></div></div>';
  }
  function wireGame(ch,artId,body){
    var g=Data.gameOfArtifact(artId);
    if(g){ var host=Util.$('#gameHost',body); if(host) Games.mount(g.id,host); }
  }

  /* ---- 幕末：破解与升华 + 印记点亮 + 情绪自评 ---- */
  function slideClear(ch){
    var c=Data.chapterById[ch], b=Data.beasts[c.beast];
    var lit=!!(Store.state.progress.seals&&Store.state.progress.seals[c.seal]);
    var emo=(Store.state.progress.chapters[ch]&&Store.state.progress.chapters[ch].emotion)||'';
    return '<div class="card" style="border-color:'+b.main+'55">'+
      '<div class="tag" style="background:'+b.accent+';color:'+b.main+'">化解 · '+Util.esc(c.crisis)+'</div>'+
      '<h3 style="color:'+b.main+';margin:8px 0">破解：'+Util.esc(c.mission)+'</h3>'+
      '<p class="muted">'+(c.endingNote?Util.esc(c.endingNote):'河道重新有水，粮船列队通过；'+Util.esc(b.name)+'掠过头顶。')+'</p>'+
      '<div class="part" data-part-body>'+
        (lit
          ? sealLitHtml(c,b)
          : '<button class="btn gold" id="sealGo" type="button">化解危机 · 点亮'+Util.esc(b.name)+'印记</button>')+
      '</div>'+
      '<p class="muted" style="margin-top:10px"><b>任务完成：</b>'+Util.esc(c.climax)+'</p>'+
      '<div class="muted" style="margin-top:10px">这一章你的心情是？</div>'+
      '<div class="row" data-emo>'+
        ['开心','一般','有点难'].map(function(e){ return '<button class="btn ghost sm'+(emo===e?' jade':'')+'" type="button" data-emo="'+e+'" aria-pressed="'+(emo===e)+'">'+e+'</button>'; }).join('')+
        (emo?'<span class="tag jade">已记录：'+Util.esc(emo)+'</span>':'')+
      '</div>'+
      '</div>';
  }
  function sealLitHtml(c,b){
    return '<div class="energy-pill" style="background:'+b.accent+';color:'+b.main+';border-color:'+b.main+'55">'+
      Assets.icon('u-star',null,'印记')+' 已点亮 · '+Util.esc(b.dirLabel)+'方 '+Util.esc(b.name)+'印记</div>'+
      '<p class="muted" style="margin-top:6px">'+Util.esc(b.praiseText)+'（它是你的'+Util.esc(b.dirLabel)+'方守护搭档）</p>';
  }
  function wireClear(ch,body){
    var go=Util.$('#sealGo',body);
    if(go) go.onclick=function(){
      var c=Data.chapterById[ch], b=Data.beasts[c.beast];
      var isNew=Store.settleOnce('seal:'+ch,function(){
        var st=Store.state;
        if(!st.progress.seals) st.progress.seals={ qinglong:false, zhuque:false, baihu:false, xuanwu:false };
        st.progress.seals[c.seal]=true;
        var p=st.progress.chapters[ch]||(st.progress.chapters[ch]={intro:false,cleared:false,emotion:null});
        p.cleared=true;
        Store.logEvent({ type:'seal', chapter:ch, dim:c.dim, literacy:'国家认同', meta:{ seal:c.seal, beast:c.beast } });
        Store.logEvent({ type:'chapter_clear', chapter:ch, dim:c.dim, literacy:'乐学善学' });
      });
      if(isNew){ addEnergy(SEAL_ENERGY,'点亮'+b.name+'印记'); if(Pet&&Pet.celebrate) Pet.celebrate(); }
      renderHUD();
      var container=Util.$('[data-part-body]',body);
      replaceNode(container,sealLitHtml(c,b));
      Toast(isNew?('已点亮 · '+b.name+'印记'):'印记已点亮');
    };
    var emoBar=Util.$('[data-emo]',body);
    if(emoBar) emoBar.onclick=function(e){
      var t=e.target.closest('[data-emo]'); if(!t) return;
      var val=t.getAttribute('data-emo'), st=Store.state;
      var p=st.progress.chapters[ch]||(st.progress.chapters[ch]={intro:false,cleared:false,emotion:null});
      p.emotion=val; Store.logEvent({ type:'emotion', chapter:ch, literacy:'健全人格', meta:{ emotion:val } });
      Store.saveState(true); Audio.play('ui_tap');
      renderSlide(Util.safeNum((Router.current()||{}).deckIndex,0));
    };
  }

  function wireSlide(ch,s,body){
    if(s.kind==='intro') wireIntro(ch,body);
    else if(s.kind==='art') wireArtifact(ch,s.artifactId,body);
    else if(s.kind==='game') wireGame(ch,s.artifactId,body);
    else wireClear(ch,body);
  }

  /* 状态导出（供测试断言） */
  function state(){
    var ch=chId(), cur=Router.current();
    return { chapterId:ch, deckIndex:cur?cur.deckIndex:0, slides:slidesFor(ch).length,
             seals:Object.assign({},Store.state.progress.seals) };
  }
  return { build:build, mount:mount, onAct:onAct, renderSlide:renderSlide, slidesFor:slidesFor,
           replaceNode:replaceNode, state:state, BUILD_STEP:BUILD_STEP, SEAL_ENERGY:SEAL_ENERGY };
})();


var App=(function(){
  var errors=[];
  function registries(){
    ChatOverlay.bind(); DetailOverlay.bind(); RefImg.bind(); Bag.bind();
    Router.register({ id:'screen-launch', kind:'onboarding', title:'启程', navLabel:'启程',
      html:function(){ return Screens.buildLaunch(); }, onMount:function(root){ Screens.mountLaunch(root); } });
    Router.register({ id:'screen-oath', kind:'onboarding', title:'任命', navLabel:'任命',
      html:function(){ return Screens.buildOath(); }, onMount:function(root){ Screens.mountOath(root); } });
    Router.register({ id:'screen-hub', kind:'hub', title:'指挥官舱', navLabel:'指挥官舱',
      html:function(){ return Screens.buildHub(); }, onMount:function(root){ Screens.mountHub(root); },
      onEnter:function(){ renderChapterNav(); if(Pet.state().mounted) Pet.unPerch(); } });
    Router.register({ id:'screen-ch', kind:'chapter', title:'章节', navLabel:'章节',
      html:function(p){ return Chapter.build(p); }, onMount:function(root){ Chapter.mount(root); },
      onAct:function(i){ Chapter.onAct(i); },
      onEnter:function(p){ var ch=p&&p.chapterId; if(ch){ Assets.injectSymbols('art-'+ch); Audio.loopBGM((Data.chapterById[ch]||{}).bgm||'bgm_ch1',0.8); } renderChapterNav(); if(Pet.state().mounted) Pet.toPerch(); },
      onExit:function(){ try{ Games.teardown(); }catch(e){} if(Pet.state().mounted) Pet.unPerch(); } });
    Router.register({ id:'screen-express', kind:'solo', title:'表达工坊', navLabel:'表达工坊',
      html:function(p){ return Express.build(p); }, onMount:function(root){ Express.mount(root,Router.current()?Router.current().params:{}); },
      onEnter:function(){ renderChapterNav(); if(Pet.state().mounted) Pet.unPerch(); } });
    Router.register({ id:'screen-home', kind:'solo', title:'居家养成', navLabel:'居家养成',
      html:function(){ return Home.build(); }, onMount:function(root){ Home.mount(root); },
      onEnter:function(){ renderChapterNav(); if(Pet.state().mounted) Pet.unPerch(); } });
    Router.register({ id:'screen-report', kind:'solo', title:'我的战绩报告', navLabel:'我的战绩报告',
      html:function(){ return Assess.build(); }, onMount:function(root){ Assess.mount(root); },
      onEnter:function(){ renderChapterNav(); if(Pet.state().mounted) Pet.unPerch(); } });
    Router.register({ id:'screen-birth', kind:'solo', title:'灵宠诞生', navLabel:'灵宠诞生',
      html:function(){ return Birth.build(); }, onMount:function(root){ Birth.mount(root); },
      onEnter:function(){ renderChapterNav(); if(Pet.state().mounted) Pet.unPerch(); } });
    Router.register({ id:'screen-meet-card', kind:'solo', title:'见面卡', navLabel:'见面卡',
      html:function(){ return MeetCard.build(); }, onMount:function(root){ MeetCard.mount(root); },
      onEnter:function(){ renderChapterNav(); if(Pet.state().mounted) Pet.unPerch(); } });
  }
  function wireChrome(){
    /* 音效开关 */
    var sb=Util.$('#btnSound'), si=Util.$('#btnSoundIcon');
    function paintSound(){ var m=Audio.isMuted(); if(sb){ sb.setAttribute('aria-pressed',m?'true':'false'); sb.setAttribute('aria-label',m?'音效已关闭，点击开启':'音效已开启，点击静音'); } if(si) si.innerHTML=Assets.icon(m?'u-sound-off':'u-sound-on',null,m?'音效关闭':'音效开启'); }
    if(sb) sb.onclick=function(){ Audio.resume(); Audio.setMuted(!Audio.isMuted()); paintSound(); Toast(Audio.isMuted()?'已静音':'音效已开启'); };
    paintSound();
    /* 聊聊按钮 */
    var cb=Util.$('#btnChat'), ci=Util.$('#btnChatIcon');
    if(ci) ci.innerHTML=Assets.icon('u-chat',null,'对话');
    if(cb) cb.onclick=function(){ ChatOverlay.open(); };
    /* 线索背包 */
    var bag=Util.$('#btnBag'); if(bag) bag.onclick=function(){ Bag.open(); };
    /* resume 横幅 */
    var go=Util.$('#resumeGo'), skip=Util.$('#resumeSkip');
    if(go) go.onclick=function(){ Audio.resume(); var lr=Store.state.progress.lastRoute; hideResume(); if(lr&&Router.restore(lr)){ renderChapterNav(); } else { Router.push('screen-hub'); } };
    if(skip) skip.onclick=function(){ Store.resetState(); Store.loadState(); hideResume(); Pet.render(); Router.push('screen-launch'); };
    /* 首次手势后恢复音频 */
    var resumeAudio=function(){ try{ Audio.resume(); }catch(e){} document.removeEventListener('pointerdown',resumeAudio); document.removeEventListener('keydown',resumeAudio); };
    document.addEventListener('pointerdown',resumeAudio);
    document.addEventListener('keydown',resumeAudio);
    /* 全局事件 */
    Util.bus.on('ui:toast',Toast);
    Util.bus.on('store:quota',function(){ Toast('本地存储快满了，画作只保留最近几幅'); });
  }
  function hideResume(){ var el=Util.$('#resumeBanner'); if(el) el.classList.add('hide'); }
  function showResume(lr){
    var el=Util.$('#resumeBanner'), tx=Util.$('#resumeText');
    var c=lr.chapterId?Data.chapterById[lr.chapterId]:null;
    var desc=c?('第'+Data.chapters.indexOf(c)+1+'章 · 第 '+((Util.safeNum(lr.actIndex,0))+1)+' 件'):'上次的位置';
    if(tx) tx.textContent='接着上次玩？（'+desc+'）';
    if(el) el.classList.remove('hide');
  }
  function pickStart(){
    var st=Store.state, lr=st.progress.lastRoute;
    var hasProgress=!!(st.pet.beast&&st.profile.commander);
    var deep=(lr&&Array.isArray(lr.stackIds)&&lr.stackIds.length>1);
    if(deep&&hasProgress){ showResume(lr); return; }
    if(hasProgress){ Router.push('screen-hub'); return; }
    Router.push('screen-launch');
  }
  function init(){
    /* 错误收集（绝不阻断） */
    window.onerror=function(msg,src,line,col,err){ errors.push({msg:msg,src:src,line:line,col:col}); var d=Util.$('#devcheck'); if(d) d.textContent=JSON.stringify(errors); return false; };
    window.addEventListener('unhandledrejection',function(ev){ errors.push({reject:String(ev&&ev.reason)}); });
    /* ---- 阶段 ①：同步 —— 立即构建可交互首屏 ---- */
    Store.loadState();
    Assets.injectSymbols('base');
    Assets.injectSymbols('pet');
    registries();
    wireChrome();
    renderHUD();
    renderChapterNav();
    Pet.mount(); Pet.render();
    Router.installGlobal();
    pickStart();
    if(Store.state._migratedFromV1){ Toast('检测到旧存档，已为你升级到 2.0'); }
    renderHUD();
    /* ---- 阶段 ②：空闲 —— 预建 Hub 与当前章首幕（隐藏缓存，本轮仅预热） ---- */
    var idle=window.requestIdleCallback||function(fn){ return setTimeout(fn,200); };
    idle(function(){
      try{ Screens.buildHub(); }catch(e){}
      try{ var lr=Store.state.progress.lastRoute; if(lr&&lr.chapterId) Assets.injectSymbols('art-'+lr.chapterId); }catch(e){}
    });
    /* ---- 阶段 ③：进入某章时懒注入该章文物符号（在路由 onEnter 中调用） ---- */
    Util.bus.on('route:change',function(e){
      if(e&&/^screen-ch/.test(e.id)){ var ch=e.params&&e.params.chapterId; if(ch) Assets.injectSymbols('art-'+ch); }
      renderChapterNav();
    });
    Util.bus.emit('app:ready',{ errors:errors });
  }
  return { init:init, errors:function(){ return errors.slice(); } };
})();

/* ---- 测试/调试钩子（无头环境断言用；不产生外部请求） ---- */
window.__CANAL__={ Store:Store, Data:Data, Util:Util, Assets:Assets, Audio:Audio, Overlays:Overlays, RefImg:RefImg,
                   Router:Router, Pet:Pet, Agent:Agent, ChatOverlay:ChatOverlay, DetailOverlay:DetailOverlay,
                   Screens:Screens, Bag:Bag, Chapter:Chapter, Primitives:Primitives, Games:Games,
                   Express:Express, Home:Home, Assess:Assess, Birth:Birth, MeetCard:MeetCard, App:App, version:'2.0' };

/* ---- 启动 ---- */
try{ App.init(); }
catch(e){
  try{
    document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;left:0;right:0;bottom:0;background:#fff;color:#8E2A1E;padding:8px;font-size:12px;z-index:9999">启动遇到问题：'+Util.esc(e&&e.message||e)+'</div>');
  }catch(_){}
}
})();
</script>
</body>
</html>
